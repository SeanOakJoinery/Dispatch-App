- 2026-09-09: renderCol() was already sorting cards alphabetically by
  a.type.localeCompare(b.type,...), but plain localeCompare treats
  embedded numbers character-by-character, not numerically — so e.g.
  "Aluminium Flat Bar 2813x19" sorted BEFORE "Aluminium Flat Bar
  854x38" (since '2' < '8' as a character), which is backwards from
  what anyone would expect. Per user request ("everything running
  alphabetically and with sizes"), added naturalCompare(a,b) near
  uid() — splits each string into alternating text/number chunks,
  compares text chunks case-insensitively and number chunks
  numerically — and swapped renderCol()'s sort to use it instead.
  Same fix applied in parallel to the linked Stock List app (which
  has its own identical copy of this helper, plus its own size field
  to sort by — see that app's changelog).

  fully complete) — see viewAllNotes' Waiting for signature/Delivered
  split below for where they go from there.

  items: [{stockItemId, type, qty, ref}], isCollection (bool),
  driverSignature (dataURL|

  (dataURL|null), siteSignedDate, siteSignedBy, pdfUrl }.

  themselves — there is no driver leg, so driverSignature/driverName/
  vehicleReg stay empty and the SINGLE signature captured at dispatch
  time is written straight into siteSignature/siteSignedBy/
  siteSignedDate. That makes isNoteComplete() true immediately, which
  is what takes the items off the board and files the note under

  PERMISSION_LABELS (controls the checkbox list in Manage Users) AND
  wherever it should gate something (applyPermissionsToUi + the
  function itself).

KEY BUSINESS RULES (do not regress these without the user asking)
1. isNoteComplete() = true iff the note has a SITE signature. Driver
   signature does NOT lock it. Deliberate: driver can sign & save,
   note stays fully editable until the site signature lands — that is
   the one action that locks it.
2. A pending (unlocked) note lets you: add items from Finished stock or
   ad-hoc, remove items (min 1 must remain), edit customer name,
   capture/redo driver signature independently ("Save driver
   signature", no site signature needed at the same time), and capture
   the site signature independently ("Submit site signature & lock").
3. A locked note cannot have items, customer, or signatures changed via
   the normal Edit screen — that button disappears once locked. The
   ONE exception is "Edit signing details" (openSigningDetails /
   saveSigningDetails) — always available, locked or not, old or new —
   which only touches: driver name, vehicle registration, site signer
   name, driver signed date, site signed date. Never items, customer,
   or the signature images. Exists so old notes can be backfilled
   without reopening the whole note.
   ROOT OVERRIDE (2026-09-02): root users are the one exception to the
   whole lock. In viewNote(), `rootOverride = complete && current user
   isRoot` — when true, the pending/editable branch renders instead of
   the read-only docket branch (item add/remove, "Edit customer /
   signature" via openEditNote, and a re-signable site-signature
   canvas whose button reads "Update site signature" instead of
   "...& lock"), plus the normally-read-only-view's Print/Email/
   WhatsApp/Save-to-Drive buttons are added alongside so root doesn't
   lose those. No banner or other indicator distinguishes this from the
   normal pending-note edit view (removed per user request 2026-09-02)
   — the only visible difference is the extra share/print/Drive buttons
   and the site-signature button's label.
   None of the underlying mutators (removeNoteItem, addFinishedItemToNote,
   addAdhocItemToNote, confirmSiteSignature, openEditNote/saveEditedNote)
   actually check isNoteComplete themselves — the lock was always a UI-only
   gate in viewNote() — so no changes were needed there, only to which
   branch of viewNote() root sees.
4. Adding stock (Unfinished, Finished, delivery-note cart lines, or ad-hoc
   additions to a pending note) merges into an existing card with the
   same type + reference instead of duplicating — see
   findMergeTarget(). "Combine duplicates" does a one-time bulk merge
   of Unfinished/Finished only (not Dispatched — those are tied 1:1 to
   specific note line items).
5. Removing a stock item (× on a card) prompts for a quantity rather
   than always deleting the whole card — see removeItem(). Finished
   removals are meant for damaged/written-off stock.
6. Delivery notes support MULTIPLE items per note via a cart
   (dispatchCart — see addToDispatchCart / renderCartPanel). Finished
   cards say "Add to delivery note" to stage them; the Dispatched
   column's quick-add form stages ad-hoc lines the same way. "Review &
   sign" opens the driver-signature step for the whole cart at once.
7. A new note can be created with NO signature via "Save for now"
   (submitDispatch(false)) — items still move to Dispatched, note just
   isn't signed yet.

DOCKET ITEM LAYOUT
- Each item line on the docket is 3 columns, in this order: item number
  (#), Qty, Description — see itemLines / itemsHeader inside viewNote().
  Don't reorder these or add a 4th visible column without the user
  asking.
- Per-item `ref` is NOT shown next to the description anymore (used to
  be "Type — ref"). It's intentionally hidden from the docket and the
  plain-text share summary (noteTextLines) — don't reintroduce it there.
- In the "Delivery note" review modal (showDispatchModal), the Customer /
  destination field is pre-filled from the cart items' ref value(s)
  (dedup'd, joined) instead of showing ref next to each item — see
  `cartRefs` / `defaultCustomer` in showDispatchModal(). Still editable
  before submitting.

DATE FORMAT
- todayStr() spells the month out in full, e.g. "28 August 2026" (not
  the abbreviated "28 Aug 2026"). Used everywhere a date is shown
  (header dateline, docket date, signature dates) — keep it consistent
  if touching date formatting again.

SIGNATURE CAPTURE
- Multiple independent pads can exist on screen at once (needed for the
  Edit screen: driver + site pads together). Handled via `sigPads`, a
  map keyed by canvas id — NOT a single global pad. Always pass an
  explicit canvasId to setupSignaturePad/clearSignature/
  getSignatureDataUrl; don't reintroduce a single-pad global.

SHARING
- Print / Email / WhatsApp / "Save to Drive" all render the SAME
  #printArea docket template (docketHtml inside viewNote()) via
  html2canvas + jsPDF — any docket layout change automatically applies
  everywhere. Never build a second copy of the docket markup.
- Email/WhatsApp try navigator.share() (native file-share sheet, shows
  the actual docket image, signatures included) first, falling back to
  plain-text mailto:/wa.me links where that's unavailable (typical on
  desktop).

// Users & permissions — client-side only (not a real security boundary,
// see dev notes). Root always has every permission regardless of the

function defaultPermissions(){
  return {
    addItems: false,      // Add forms (Unfinished/Finished/Dispatched) + one-off items
    removeItems: false,   // × delete button on cards
    markFinished: false,  // "Mark finished" — Unfinished → Finished (split out of moveItems 2026-09-24)
    moveItems: false,     // Mark ready, Add to delivery note (stage into cart)
    returnToStock: false, // "Return to stock" — undoes a mistaken send from
                           // the Stock List app, crediting its components
                           // back over there and removing the item here.
                           // Deliberately separate from moveItems/removeItems
                           // per user request — this writes to the OTHER
                           // app's data, so it's worth being able to grant

                           // permissions.
    manageNotes: false,   // Delivery notes list, review & sign, edit signing details
    manageTypes: false,   // Manage items (item catalog)
    exportData: false,    // Download today's sheet, Combine duplicates
    manageSync: false,    // No longer used — Google Drive was removed entirely
                           // (replaced by automatic Firebase Storage PDF
                           // archiving, no per-user setting needed). Kept as a
                           // key only so existing users[] records with this

    manageUsers: false,   // Add/edit/remove users (root always has this)
    markBuilt: false,     // Not used by THIS app — carried here purely so the
                           // linked Stock List app's "Mark built" button (which
                           // reads this same permissions object via its own
                           // can('markBuilt') check, since users/permissions
                           // are now shared between the two apps) can be
                           // granted per-person instead of only ever working
                           // for root. See 2026-09-07 changelog entry.
    renameCategories: false, // Also not used by THIS app — same reasoning as
                           // markBuilt above, but for the Stock List app's
                           // "rename category" feature (renames every item

                           // permission rather than reusing manageTypes, per

    stockAddQty: false,    // Not used by THIS app — Stock List's "+" stepper
                           // button and its Add-item form. Split out from
                           // Stock List's old "addItems" per user request
                           // ("on the + and - i want that to be separate and
                           // the edit to be separate"). IMPORTANT: this key
                           // is intentionally DIFFERENT from this app's OWN
                           // addItems above — those are unrelated Dispatch
                           // board permissions that happen to share a name;
                           // conflating them was a pre-existing bug this
                           // namespacing fixes going forward.
    stockRemoveQty: false, // Not used by THIS app — Stock List's "−" stepper
                           // button (minimizing stock quantity). Separate
                           // from Stock List's own "Remove items" (the ×
                           // delete-a-line-entirely button), which is a
                           // different, already-existing action.
    stockEditItems: false, // Not used by THIS app — Stock List's "edit"
                           // button (item description/category/size/
                           // material). See stockAddQty note above for why
                           // this isn't just reusing this app's own
                           // addItems/removeItems keys.
    copyJobs: false,       // Not used by THIS app — Stock List's "copy job" button
    boardAddBoard: false,  // Not used by THIS app — Board Stock Take
    boardAddQty: false,    // Not used by THIS app — Board Stock Take
    boardRemoveQty: false, // Not used by THIS app — Board Stock Take
    boardSendToDispatch: false, // Not used by THIS app — Board Stock Take
    boardViewLog: false,   // Not used by THIS app — Board Stock Take
    boardSettings: false,  // Not used by THIS app — Board Stock Take
    consManageItems: false,       // Not used by THIS app — Consumables
    consHandOut: false,           // Not used by THIS app — Consumables
    consManageConsumables: false, // Not used by THIS app — Consumables
    consViewReports: false,       // Not used by THIS app — Consumables
    consExportExcel: false,       // Not used by THIS app — Consumables
    consSendToDispatch: false     // Not used by THIS app — Consumables
  };
}

function getCurrentUser(){
  return users.find(u => u.id === currentUserId) || null;
}

function can(key){
  const u = getCurrentUser();
  if(!u) return false;
  if(u.isRoot) return true;
  // markFinished (2026-09-24) was split out of moveItems so "Unfinished →
  // Finished" can be given on its own. Anyone who had moveItems before
  // this existed keeps being able to mark finished until someone
  // explicitly ticks/unticks the new box for them.
  if(key === 'markFinished' && u.permissions && u.permissions.markFinished === undefined) return !!u.permissions.moveItems;
  return !!(u.permissions && u.permissions[key]);
}

function currentUserIsRoot(){
  const u = getCurrentUser();
  return !!(u && u.isRoot);
}

// --- PER-APP ACCESS (added 2026-09-11) ---------------------------------
// users[] is shared between this app and the Stock List app (same
// Firebase 'dispatchBoard' node), so a single account can now be scoped
// to one app or both. u.apps = { dispatch: bool, stock: bool }.
// APP_ID is the ONLY line that differs between the two apps' copies of
// this block — keep them otherwise identical.
const APP_ID = 'dispatch';
const APP_LABELS = { dispatch: 'Dispatch app', stock: 'Stock List app', boardStock: 'Board Stock app', consumables: 'Consumables app' };

function defaultApps(){
  return { dispatch: true, stock: true, boardStock: true, consumables: true };
}

// The main root is the board's original owner: the only account that can
// reach every app regardless of its apps{} flags, and the only one that
// can change anyone's app access (including other roots'). Identified by
// isMainRoot; for boards created before this existed, falls back to the
// first root account, which is always the one createRootAccount() made.
function getMainRoot(){
  return users.find(u => u.isMainRoot) || users.find(u => u.isRoot) || null;
}

function isMainRoot(u){
  const mr = getMainRoot();
  return !!(u && mr && u.id === mr.id);
}

function currentUserIsMainRoot(){
  return isMainRoot(getCurrentUser());
}

// Whether a given user may use the app this file is. Main root always
// can. Everyone else needs the flag; accounts predating this feature
// have no apps{} at all, so they default to full access rather than
// being locked out by an upgrade.
function userHasApp(u, appId){
  appId = appId || APP_ID;
  if(!u) return false;
  if(isMainRoot(u)) return true;
  if(!u.apps) return true; // legacy account — not yet scoped
  return !!u.apps[appId];
}

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});
}
document.getElementById('dateline').textContent = todayStr();

// HTML-escapes any user-supplied text (item descriptions, references,
// usernames, delivery-note fields) before it's inserted via innerHTML,
// to stop stored XSS — e.g. someone typing <img onerror=...> as an item
// description or delivery note field. ALWAYS wrap user-typed strings in
// this before interpolating into an innerHTML template. See dev notes.
function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// PINs are stored as SHA-256 hashes, never plaintext — so reading the
// synced jsonbin data (or the board's local storage) doesn't hand
// someone every PIN in one go. Still not a real security boundary (a
// short numeric PIN is crackable if someone gets the hash and really
// wants it), but it's a meaningful step up from plaintext.
async function hashPin(pin){
  // Shared with the other three apps via oak-core; same SHA-256 hex as before.
  if(window.OakCore && OakCore.hashPin) return OakCore.hashPin(pin);
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Failed-PIN lockout — in-memory only (resets on page reload), just to
// slow down someone sitting there guessing a 4-digit PIN repeatedly.
const loginAttempts = {}; // userId -> { count, lockedUntil }
const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MS = 30000;

function isoDate(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function exportDaySheet(auto){
  if(!can('exportData')) return;
  const today = todayStr();
  const todaysNotes = state.notes.filter(n => n.date === today);
  if(todaysNotes.length === 0){
    if(!auto) alert('No dispatches logged today yet.');
    return;
  }
  const rows = [['Delivery note','Date','Customer','Item','Reference','Qty','Signed']];
  todaysNotes.forEach(n => {
    n.items.forEach(it => {
      rows.push([n.number, n.date, n.customer, it.type, it.ref || '', it.qty, isNoteComplete(n) ? 'Yes' : 'No']);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:12},{wch:22},{wch:20},{wch:18},{wch:6},{wch:8}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, isoDate());
  XLSX.writeFile(wb, 'Dispatch-' + isoDate() + '.xlsx');
}

function uid(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Natural/alphanumeric sort — compares embedded numbers numerically
// instead of character-by-character, so "Cleat 854x38" sorts before
// "Cleat 1562x17" (plain localeCompare would put "1562..." first since
// '1' < '8' as a character). Per user request: "everything running
// alphabetically and with sizes". Splits each string into alternating
// text/number chunks and compares text chunks case-insensitively,
// number chunks numerically.
function naturalCompare(a, b){
  const ax = [], bx = [];
  String(a || '').replace(/(\d+)|(\D+)/g, (_, num, str) => { ax.push([num ? parseInt(num, 10) : Infinity, str || '']); return ''; });
  String(b || '').replace(/(\d+)|(\D+)/g, (_, num, str) => { bx.push([num ? parseInt(num, 10) : Infinity, str || '']); return ''; });
  while(ax.length && bx.length){
    const an = ax.shift(), bn = bx.shift();
    const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1], undefined, {sensitivity: 'base'});
    if(nn) return nn;
  }
  return ax.length - bx.length;
}

const hasClaudeStorage = typeof window.storage !== 'undefined';
const localStore = {
  async get(key){
    const v = window.localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    window.localStorage.setItem(key, value);
    return { key, value };
  }
};
const storage = hasClaudeStorage ? window.storage : localStore;

async function load(){
  try{
    const res = await storage.get('board', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.items = parsed.items || [];
      state.notes = parsed.notes || [];
      nextNo = parsed.nextNo || (state.notes.length + 1);
      itemTypes = (parsed.itemTypes && parsed.itemTypes.length) ? parsed.itemTypes : DEFAULT_ITEM_TYPES.slice();
      users = parsed.users || [];
      drivers = parsed.drivers || [];
    }
  }catch(e){ }
  renderTypeSelects();
  renderDriverOptions();
  render();

  // Firebase is baked into this file (see <head>) so every device
  // connects automatically — no API key/Bin ID to enter, no "Connect
  // instead" screen needed. initFirebaseBoardSync() sets up a live
  // listener that fires immediately with current data (and again
  // instantly whenever ANY device writes), so by the time checkLogin()
  // runs, users[] is always genuinely live rather than a possibly-stale
  // local cache — this is what makes "Create root account" a true
  // last-resort fallback now instead of something a new device could
  // hit by mistake.
  await initFirebaseBoardSync();
  await checkLogin();
}

async function save(){
  try{
    await storage.set('board', JSON.stringify({items: state.items, notes: state.notes, nextNo, itemTypes, users, drivers}), false);
  }catch(e){ console.error('storage failed', e); }
  queuePushToFirebase();
}

function renderTypeSelects(){

}

function addItemType(){
  const input = document.getElementById('newTypeInput');
  const name = input.value.trim();
  const err = document.getElementById('typeErr');
  if(!name){
    err.textContent = 'Enter a name for the item';
    err.style.display = 'block';
    return;
  }
  if(itemTypes.includes(name)){
    err.textContent = 'That item already exists';
    err.style.display = 'block';
    return;
  }
  itemTypes.push(name);
  save();
  renderTypeSelects();
  openManageTypes();
}

function removeItemTypeAt(index){
  itemTypes.splice(index, 1);
  save();
  renderTypeSelects();
  openManageTypes();
}

// Driver roster — mirrors the "Manage items" pattern above exactly.
// Adding is root-only per user request; renderDriverOptions() below
// populates the <datalist> the actual driver-name fields use, so
// anyone completing a delivery note gets autocomplete suggestions from
// whatever root has added, but only root can grow that list.

      <div style="max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:14px;">

      </div>
      <div class="field">
        <label>New driver name</label>
        <input type="text" id="newDriverInput" placeholder="e.g. Thabo M." style="width:100%;">
      </div>
      <div id="driverErr" style="color:var(--rust);font-size:12px;margin-top:8px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Done</button>
        <button class="btn btn-primary" onclick="addDriver()">Add driver</button>
      </div>
    </div>
  </div>`;
}

function addDriver(){
  if(!currentUserIsRoot()) return;
  const input = document.getElementById('newDriverInput');
  const name = input.value.trim();
  const err = document.getElementById('driverErr');
  if(!name){
    err.textContent = 'Enter a name for the driver';
    err.style.display = 'block';
    return;
  }
  if(drivers.includes(name)){
    err.textContent = 'That driver already exists';
    err.style.display = 'block';
    return;
  }
  drivers.push(name);
  save();
  renderDriverOptions();
  openManageDrivers();
}

function removeDriverAt(index){
  if(!currentUserIsRoot()) return;
  drivers.splice(index, 1);
  save();
  renderDriverOptions();
  openManageDrivers();
}

function renderDriverOptions(){
  const list = document.getElementById('driverList');
  if(!list) return;
  list.innerHTML = drivers.map(d => `<option value="${escHtml(d)}"></option>`).join('');
}

function specHtml(type){
  const s = SPECS[type];
  if(!s) return '';
  return '<div class="spec">' + s.map(l => '<div><span class="tag">-</span><span>'+l+'</span></div>').join('') + '</div>';
}

// Board search (2026-09-24): filters every column by item name, job /
// reference or quantity. Empty search shows everything as before.
let boardSearchTerm = '';
function itemMatchesSearch(it){
  const q = (boardSearchTerm || '').trim().toLowerCase();
  if(!q) return true;
  return q.split(/\s+/).every(w => `${it.type || ''} ${it.ref || ''} x${it.qty || ''}`.toLowerCase().includes(w));
}
function render(){
  const cols = {unvinaged:[], vinaged:[], ready:[], dispatched:[]};
  let archivedCount = 0;
  let hiddenBySearch = 0;
  state.items.forEach(it => {
    if(it.status === 'dispatched'){
      const note = state.notes.find(n => n.id === it.noteId);
      // CHANGED 2026-09-11 per user request: items now leave the
      // Dispatched column as soon as the DRIVER signs (out for
      // delivery -> handed over), not only once fully complete —
      // previously this only hid items once isNoteComplete() (site
      // signature too) was true. The note itself (with its remaining
      // items) then shows under "Waiting for signature" in the
      // Delivery Notes list (viewAllNotes) until the site/client also
      // signs, at which point it moves to "Delivered" there.
      // A collection note has no driver handover, so its single
      // (site) signature is what takes items off the board.
      if(note && (note.driverSignature || (note.isCollection && note.siteSignature))){
        archivedCount++;
        return; // handed over — out of the active board, still viewable via "Delivery notes"
      }
    }
    if(!itemMatchesSearch(it)){ hiddenBySearch++; return; }
    if(cols[it.status]) cols[it.status].push(it);
  });
  const searchInfo = document.getElementById('boardSearchInfo');
  if(searchInfo) searchInfo.textContent = (boardSearchTerm || '').trim()
    ? `${cols.unvinaged.length + cols.vinaged.length + cols.ready.length + cols.dispatched.length} match${hiddenBySearch ? `, ${hiddenBySearch} hidden` : ''}`
    : '';

  document.getElementById('cnt-unvinaged').textContent = cols.unvinaged.length;
  document.getElementById('cnt-vinaged').textContent = cols.vinaged.length;
  document.getElementById('cnt-ready').textContent = cols.ready.length;
  document.getElementById('cnt-dispatched').textContent = cols.dispatched.length;
  document.getElementById('notesCount').textContent = state.notes.length;

  const hintEl = document.getElementById('archivedHint');
  if(hintEl){
    if(archivedCount > 0){
      hintEl.textContent = `${archivedCount} item${archivedCount === 1 ? '' : 's'} handed to the driver — view under "Delivery notes"`;
      hintEl.style.display = 'block';
    } else {
      hintEl.style.display = 'none';
    }
  }

  renderCol('unvinaged', cols.unvinaged);
  renderCol('vinaged', cols.vinaged);
  renderCol('ready', cols.ready);
  renderCol('dispatched', cols.dispatched);
  renderCartPanel();
}

function renderCartPanel(){
  const el = document.getElementById('cartPanel');
  if(!el) return;
  if(dispatchCart.length === 0){
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `<div class="cart-panel">
    <div class="cart-title">Delivery note in progress — ${dispatchCart.length} item${dispatchCart.length > 1 ? 's' : ''}</div>
    ${dispatchCart.map(c => `<div class="cart-line"><span>${escHtml(c.type)}${c.ref ? ' — ' + escHtml(c.ref) : ''} x${c.qty}</span>${can('moveItems') ? `<button class="rm" onclick="removeFromCart('${c.tempId}')" title="Remove">&times;</button>` : ''}</div>`).join('')}
    ${can('manageNotes') ? `<button class="btn btn-primary btn-sm" onclick="startDispatchFromCart()">Review &amp; sign (${dispatchCart.length})</button>` : ''}
  </div>`;
}

function renderCol(status, list){
  const el = document.getElementById('col-'+status);
  if(list.length === 0){
    el.innerHTML = '<div class="empty">No stock here</div>';
    return;
  }
  const sorted = list.slice().sort((a, b) => naturalCompare(a.type, b.type));
  el.innerHTML = sorted.map(it => cardHtml(it, status)).join('');
}

function isNoteComplete(note){
  return !!(note.siteSignature || note.signature);
}

function cardHtml(it, status){
  let actions = '';
  let dates = `<span>Added ${it.addedDate}</span>`;
  if(status === 'unvinaged'){
    actions = can('markFinished') ? `<button class="btn btn-green btn-sm" onclick="markVinaged('${it.id}')">Mark finished</button>` : '';
    // Per user request: mirrors the Stock List app's own "Return to
    // stock" (which undoes a mistaken send FROM that app) — this is
    // the same action available directly from HERE, so staff working
    // in Dispatch don't have to switch apps to fix a mistake. Only
    // shows on items that actually carry the recipe snapshot Stock
    // List attaches when it sends something over (see
    // returnItemToStock below for what it does with it).
    if(Array.isArray(it.recipeSnapshot) && it.recipeSnapshot.length > 0 && can('returnToStock')){
      actions += ` <button class="btn btn-sm" style="background:var(--rust);color:#fff;" onclick="returnItemToStock('${it.id}')">Return to stock</button>`;
    }
  } else if(status === 'vinaged'){
    dates += `<span>Finished ${it.vinagedDate}</span>`;
    // Per user request: Finished items now move to a "Ready to
    // Dispatch" holding stage after inspection, rather than straight
    // into a delivery note — markReady() mirrors markVinaged()'s
    // partial-quantity support. Adding to an actual delivery note
    // happens one stage later, from 'ready' status (see below).
    actions = can('moveItems') ? `<button class="btn btn-green btn-sm" onclick="markReady('${it.id}')">Mark ready</button>` : '';
  } else if(status === 'ready'){
    dates += `<span>Finished ${it.vinagedDate}</span><span>Ready ${it.readyDate}</span>`;
    const inCart = dispatchCart.some(c => c.stockItemId === it.id);
    if(!can('moveItems')){
      actions = '';
    } else {
      actions = inCart
        ? `<button class="btn btn-sm" disabled style="opacity:.5;">In delivery note</button>`
        : `<button class="btn btn-primary btn-sm" onclick="addToDispatchCart('${it.id}')">Add to delivery note</button>`;
    }
  } else {
    dates += `<span>Finished ${it.vinagedDate}</span><span>Ready ${it.readyDate}</span><span>Dispatched ${it.dispatchedDate}</span>`;
    const note = state.notes.find(n => n.id === it.noteId);
    const complete = note ? isNoteComplete(note) : true;
    actions = can('manageNotes')
      ? (complete
        ? `<button class="btn btn-sm" onclick="viewNote('${it.noteId}')">View delivery note</button>`
        : `<button class="btn btn-primary btn-sm" onclick="viewNote('${it.noteId}')">Complete signature</button>`)
      : '';
  }
  const canRemoveHere = can('removeItems') && (status==='unvinaged' || status==='vinaged' || (status==='ready' && !dispatchCart.some(c => c.stockItemId === it.id)));
  return `<div class="card">
    <div class="card-top">
      <div>
        <div class="card-type">${escHtml(it.type)}</div>
        ${it.ref ? `<div class="card-ref">${escHtml(it.ref)}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="card-qty">x${it.qty}</span>
        ${canEditItemHere(it, status) ? `<button class="del" title="Edit name / job / qty" onclick="openEditItem('${it.id}')" style="font-size:14px;">✎</button>` : ''}
        ${canRemoveHere ? `<button class="del" title="Remove" onclick="removeItem('${it.id}')">&times;</button>` : ''}
      </div>
    </div>
    ${specHtml(it.type)}
    <div class="card-dates">${dates}</div>
    <div class="card-actions">${actions}</div>
  </div>`;
}


// ---------- Edit an item on the board (2026-09-24) ----------
// Per user request: rename items such as "Assembly #12 (Roberst Store
// Room) copy" (copied jobs arrive from Stock List with "copy" on the end).
// Name, job/reference and qty can be changed on any card that isn't yet
// on a delivery note; optionally every card with the same name is renamed
// in one go. Items already on a delivery note are left alone, because the
// note is a signed record of what was handed over.
function canEditItemHere(it, status){
  if(!can('addItems')) return false;
  if(status === 'dispatched' || it.noteId) return false;
  return !dispatchCart.some(c => c.stockItemId === it.id);
}
function openEditItem(id){
  const it = state.items.find(x => x.id === id);
  if(!it || !canEditItemHere(it, it.status)) return;
  const sameName = state.items.filter(x => x.id !== id && x.type === it.type && !x.noteId && x.status !== 'dispatched');
  const suggestion = /\s+copy(\s+\d+)?$/i.test(it.type) ? it.type.replace(/\s+copy(\s+\d+)?$/i, '') : '';
  const layer = document.getElementById('modalLayer');
  layer.innerHTML = `<div class="modal-bg" id="editItemBg">
    <div class="modal" style="max-width:440px;">
      <h3>Edit item</h3>
      <div class="field" style="margin-top:10px;">
        <label>Name</label>
        <input type="text" id="editItemType" value="${escHtml(it.type)}" list="itemTypesList" style="width:100%;">
        ${suggestion ? `<button type="button" class="btn btn-sm" style="margin-top:6px;" onclick="document.getElementById('editItemType').value = ${escHtml(JSON.stringify(suggestion))}">Remove “copy” → ${escHtml(suggestion)}</button>` : ''}
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Reference / job</label>
        <input type="text" id="editItemRef" value="${escHtml(it.ref || '')}" style="width:100%;">
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Qty</label>
        <input type="number" id="editItemQty" value="${it.qty}" min="1" style="width:100px;">
      </div>
      ${sameName.length ? `<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;">
        <input type="checkbox" id="editItemAll" style="width:auto;"> Also rename the other ${sameName.length} card${sameName.length === 1 ? '' : 's'} called “${escHtml(it.type)}”
      </label>` : ''}
      <div id="editItemErr" style="color:var(--rust);font-size:12px;margin-top:8px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditItem('${it.id}')">Save</button>
      </div>
    </div>
  </div>`;
  setTimeout(() => { const f = document.getElementById('editItemType'); if(f){ f.focus(); f.select(); } });
}
function saveEditItem(id){
  const it = state.items.find(x => x.id === id);
  if(!it || !canEditItemHere(it, it.status)) return;
  const newType = document.getElementById('editItemType').value.trim();
  const newRef = document.getElementById('editItemRef').value.trim();
  const newQty = parseInt(document.getElementById('editItemQty').value, 10);
  const err = document.getElementById('editItemErr');
  if(!newType){ err.textContent = 'Enter a name'; err.style.display = 'block'; return; }
  if(!newQty || newQty < 1){ err.textContent = 'Qty must be 1 or more'; err.style.display = 'block'; return; }
  const all = document.getElementById('editItemAll');
  const oldType = it.type;
  if(all && all.checked){
    state.items.forEach(x => { if(x.id !== id && x.type === oldType && !x.noteId && x.status !== 'dispatched') x.type = newType; });
  }
  it.type = newType;
  it.ref = newRef;
  it.qty = newQty;
  save();
  closeModal();
  render();
}

function findMergeTarget(status, type, ref){
  return state.items.find(x => x.status === status && x.type === type && (x.ref || '') === (ref || ''));
}

function combineDuplicates(){
  if(!can('exportData')) return;
  let mergedCount = 0;
  ['unvinaged', 'vinaged', 'ready'].forEach(status => {
    const groups = {};
    state.items.filter(it => it.status === status).forEach(it => {
      const key = it.type + '|' + (it.ref || '');
      (groups[key] = groups[key] || []).push(it);
    });
    Object.values(groups).forEach(group => {
      if(group.length <= 1) return;
      const keeper = group[0];
      for(let i = 1; i < group.length; i++){
        keeper.qty += group[i].qty;
        state.items = state.items.filter(x => x.id !== group[i].id);
        mergedCount++;
      }
    });
  });
  save();
  render();
  alert(mergedCount > 0 ? `Combined ${mergedCount} duplicate card${mergedCount > 1 ? 's' : ''} into existing ones.` : 'No duplicates found — everything is already combined.');
}
document.getElementById('combineBtn').addEventListener('click', combineDuplicates);

document.getElementById('addBtn').addEventListener('click', () => {
  if(!can('addItems')) return;
  const type = document.getElementById('typeCustomInput').value.trim();
  if(!type){ alert('Enter a description for the item.'); return; }
  const addToList = document.getElementById('typeCustomToggle').checked;
  if(addToList && !itemTypes.includes(type)){
    itemTypes.push(type);
    renderTypeSelects();
  }
  const qty = Math.max(1, parseInt(document.getElementById('qtyInput').value) || 1);
  const ref = document.getElementById('refInput').value.trim();
  const existing = findMergeTarget('unvinaged', type, ref);
  if(existing){
    existing.qty += qty;
  } else {
    state.items.push({
      id: uid(), type, qty, ref,
      status: 'unvinaged',
      addedDate: todayStr(),
      vinagedDate: null,
      dispatchedDate: null,
      readyDate: null,
      noteId: null
    });
  }
  document.getElementById('refInput').value = 'NH Hotel';
  document.getElementById('qtyInput').value = 1;
  document.getElementById('typeCustomInput').value = '';
  document.getElementById('typeCustomToggle').checked = false;
  save(); render();
});

function consumeFromStatus(status, type, qty){
  let remaining = qty;
  const rest = [];
  state.items.forEach(it => {
    if(remaining > 0 && it.status === status && it.type === type){
      if(it.qty <= remaining){
        remaining -= it.qty;
      } else {
        it.qty -= remaining;
        remaining = 0;
        rest.push(it);
      }
    } else {
      rest.push(it);
    }
  });
  state.items = rest;
}

document.getElementById('addBtnFin').addEventListener('click', () => {

document.getElementById('addBtnDis').addEventListener('click', () => {

function addToDispatchCart(stockItemId){
  if(!can('moveItems')) return;
  const it = state.items.find(x => x.id === stockItemId);
  if(!it) return;
  if(dispatchCart.some(c => c.stockItemId === stockItemId)) return;
  dispatchCart.push({ tempId: uid(), stockItemId, type: it.type, qty: it.qty, ref: it.ref });
  render();
}

function removeFromCart(tempId){
  dispatchCart = dispatchCart.filter(c => c.tempId !== tempId);
  render();
}

function markVinaged(id){
  if(!can('markFinished')) return;
  const it = state.items.find(x => x.id === id);
  if(!it) return;

  let moveQty = it.qty;
  if(it.qty > 1){
    const input = prompt(`How many "${it.type}"${it.ref ? ' (' + it.ref + ')' : ''} have you finished? (${it.qty} unfinished)`, String(it.qty));
    if(input === null) return;
    const n = parseInt(input);
    if(!n || n <= 0){
      alert('Enter a quantity greater than 0.');
      return;
    }
    moveQty = Math.min(n, it.qty);
  }

  if(moveQty >= it.qty){
    // Moving the whole card — same as before, just flip its status in place.
    it.status = 'vinaged';
    it.vinagedDate = todayStr();
  } else {
    // Splitting off part of the quantity: shrink the Unfinished card by
    // moveQty, and either merge that amount into an existing Finished card
    // of the same type+ref (findMergeTarget, same merge rule "Combine
    // duplicates"/adding stock already uses) or create a new Finished card
    // for just that quantity if none exists yet.
    it.qty -= moveQty;
    const existing = findMergeTarget('vinaged', it.type, it.ref);
    if(existing){
      existing.qty += moveQty;
    } else {
      state.items.push({
        id: uid(), type: it.type, qty: moveQty, ref: it.ref,
        status: 'vinaged',
        addedDate: it.addedDate,
        vinagedDate: todayStr(),
        dispatchedDate: null,
        readyDate: null,
        noteId: null
      });
    }
  }
  save(); render();
}

// Mirrors markVinaged() exactly, one stage later — moves Finished
// stock into "Ready to Dispatch" after inspection, per user request.
// Same partial-quantity support: if only some of a Finished card's
// quantity has actually been inspected/is ready, split off just that
// amount rather than forcing the whole card to move at once.
function markReady(id){
  if(!can('moveItems')) return;
  const it = state.items.find(x => x.id === id);
  if(!it) return;

  let moveQty = it.qty;
  if(it.qty > 1){
    const input = prompt(`How many "${it.type}"${it.ref ? ' (' + it.ref + ')' : ''} are ready to dispatch? (${it.qty} finished)`, String(it.qty));
    if(input === null) return;
    const n = parseInt(input);
    if(!n || n <= 0){
      alert('Enter a quantity greater than 0.');
      return;
    }
    moveQty = Math.min(n, it.qty);
  }

  if(moveQty >= it.qty){
    it.status = 'ready';
    it.readyDate = todayStr();
  } else {
    it.qty -= moveQty;
    const existing = findMergeTarget('ready', it.type, it.ref);
    if(existing){
      existing.qty += moveQty;
    } else {
      state.items.push({
        id: uid(), type: it.type, qty: moveQty, ref: it.ref,
        status: 'ready',
        addedDate: it.addedDate,
        vinagedDate: it.vinagedDate,
        readyDate: todayStr(),
        dispatchedDate: null,
        noteId: null
      });
    }
  }
  save(); render();
}

// Undoes a mistaken send from the Stock List app — the mirror image of
// that app's own returnBuildToStock(), available directly here per
// user request ("I made it so that with stock take if i send something
// to dispatch i can write it back to stock but that feature isnt in
// dispatch yet please add that to dispatch with a tick box how can use
// it"). Reads the item's recipeSnapshot (attached by Stock List when it
// sent this over — see sendBatchToDispatchUnfinished in that app),
// adds those exact deducted quantities back into the SHARED 'stockList'
// Firebase data, then removes the item from this board. Gated by the
// new returnToStock permission, independent of moveItems/removeItems.
async function returnItemToStock(id){
  if(!can('returnToStock')) return;
  const it = state.items.find(x => x.id === id);
  if(!it || !Array.isArray(it.recipeSnapshot)){
    alert('This item has no recipe details to restore from.');
    return;
  }
  // Generalized (2026-09-22) to credit back to whichever app actually
  // sent the item, per user request to add the same "send to
  // dispatch"/"return to stock" pair to Board Stock Take and
  // Consumables, not just Stock List. Each recipeSnapshot entry now
  // carries its own sourceApp; entries sent before this change have
  // none, so they default to 'stockList' — the only app that had this
  // feature at the time, so old items keep behaving exactly as before.
  const appNames = { stockList: 'Stock List', boardStock: 'Board Stock', consumablesStock: 'Consumables' };
  const sources = [...new Set(it.recipeSnapshot.map(d => d.sourceApp || 'stockList'))];
  const sourceLabel = sources.map(s => appNames[s] || s).join(' / ');
  if(!confirm(`Return "${it.type}" (qty ${it.qty}) to stock? This adds the recipe's components back into the ${sourceLabel} app and removes this item from Dispatch. This can't be undone.`)) return;

  try{
    const missing = [];
    // Group by source app so each only needs one read + one write,
    // even if (unusually) a single item mixed sources.
    for(const sourceApp of sources){
      const entries = it.recipeSnapshot.filter(d => (d.sourceApp || 'stockList') === sourceApp);

      if(sourceApp === 'stockList'){
        // Transaction (not read-then-overwrite) so a Stock List change saved
        // at the same moment can't be lost. The function may run more than
        // once, so "missing" is rebuilt on every run.
        let missHere = [];
        await firebase.database().ref('stockList/items').transaction(current => {
          missHere = [];
          if(!current) return current;
          const stockItems = syncList(current);
          entries.forEach(d => {
            const si = stockItems.find(s => s.id === d.itemId);
            if(!si){
              if(d.deductQty || d.deductQtyL) missHere.push(d.desc || d.itemId);
              return;
            }
            si.qty = (Number(si.qty) || 0) + (d.deductQty || 0);
            if(d.deductQtyL) si.qtyL = (Number(si.qtyL) || 0) + d.deductQtyL;
            // Stock List hides empty lines after a send ("hiddenAfterDispatch");
            // stock is coming back, so show the line again.
            if(si.hiddenAfterDispatch) si.hiddenAfterDispatch = false;
          });
          return stockItems;
        });
        missing.push(...missHere);

      } else if(sourceApp === 'boardStock'){
        let missHere = [];
        await firebase.database().ref('boardStock/boards').transaction(current => {
          missHere = [];
          if(!current) return current;
          const boards = syncList(current);
          entries.forEach(d => {
            const b = boards.find(x => x.code === d.itemId);
            if(!b){ missHere.push(d.desc || d.itemId); return; }
            if(typeof b.qty !== 'object' || b.qty === null) b.qty = {};
            const loc = d.location || Object.keys(b.qty)[0] || 'Main';
            b.qty[loc] = (Number(b.qty[loc]) || 0) + (d.deductQty || 0);
          });
          return boards;
        });
        missing.push(...missHere);

      } else if(sourceApp === 'consumablesStock'){
        const screwEntries = entries.filter(d => d.kind === 'screw');
        const liquidEntries = entries.filter(d => d.kind === 'liquid');
        if(screwEntries.length){
          let missHere = [];
          await firebase.database().ref('consumablesStock/screwItems').transaction(current => {
            missHere = [];
            if(!current) return current;
            screwEntries.forEach(d => {
              const s = current[d.itemId];
              if(!s){ missHere.push(d.desc || d.itemId); return; }
              if(!s.qtyByLocation) s.qtyByLocation = {};
              const loc = d.location || Object.keys(s.qtyByLocation)[0] || 'Main';
              s.qtyByLocation[loc] = (Number(s.qtyByLocation[loc]) || 0) + (d.deductQty || 0);
            });
            return current;
          });
          missing.push(...missHere);
        }
        if(liquidEntries.length){
          let missHere = [];
          await firebase.database().ref('consumablesStock/consumableTypes').transaction(current => {
            missHere = [];
            if(!current) return current;
            liquidEntries.forEach(d => {
              const t = current[d.itemId];
              if(!t){ missHere.push(d.desc || d.itemId); return; }
              if(!t.volumeByLocation) t.volumeByLocation = {};
              const loc = d.location || Object.keys(t.volumeByLocation)[0] || 'Main';
              t.volumeByLocation[loc] = (Number(t.volumeByLocation[loc]) || 0) + (d.deductQty || 0);
            });
            return current;
          });
          missing.push(...missHere);
        }
      }
    }

    state.items = state.items.filter(x => x.id !== id);
    await save();
    render();
    if(missing.length > 0){
      alert(`Returned to stock, but these components no longer exist in the ${sourceLabel} app so couldn't be restocked: ${missing.join(', ')}`);
    }
  } catch(e){
    alert(`Could not update the ${sourceLabel} app — check your connection and try again.`);
  }
}

function removeItem(id){
  if(!can('removeItems')) return;
  const it = state.items.find(x => x.id === id);
  if(!it) return;
  const label = `${it.type}${it.ref ? ' (' + it.ref + ')' : ''}`;
  const isFinished = it.status === 'vinaged' || it.status === 'ready';
  const promptMsg = it.qty > 1
    ? `How many "${label}" do you want to remove? (${it.qty} in stock)${isFinished ? ' — use for damaged or written-off items' : ''}`
    : `Remove "${label}"?${isFinished ? ' Use for damaged or written-off items.' : ''}`;
  const input = prompt(promptMsg, String(it.qty));
  if(input === null) return;
  const n = parseInt(input);
  if(!n || n <= 0){
    alert('Enter a quantity greater than 0.');
    return;
  }
  const removeQty = Math.min(n, it.qty);
  if(removeQty >= it.qty){
    state.items = state.items.filter(x => x.id !== id);
  } else {
    it.qty -= removeQty;
  }
  save(); render();
}

// Collection mode, per user request: when the client collects the goods
// themselves there's no driver handover, so the two-signature flow
// (driver loads -> site receives) collapses to a single signature from
// whoever collects. Swaps the driver name/vehicle fields for a single
// "Collected by" name, and relabels the signature pad. submitDispatch()
// then stores that one signature as the SITE signature (not the driver
// one) so isNoteComplete() is satisfied immediately and the note goes
// straight to "Delivered" rather than sitting in "Waiting for
// signature" forever waiting for a second signature that will never
// come.
function toggleCollectionMode(){
  const isCollection = document.getElementById('collectionToggle').checked;
  document.getElementById('driverFields').style.display = isCollection ? 'none' : '';
  document.getElementById('collectorNameField').style.display = isCollection ? '' : 'none';
  document.getElementById('sigCanvasLabel').textContent = isCollection ? 'Collector signature' : 'Driver signature';
  document.getElementById('sigCanvasHint').textContent = isCollection
    ? 'Client signs to confirm they collected these items — locks this note'
    : 'Driver signs to confirm items loaded';
  document.getElementById('dispSubmitBtn').textContent = isCollection ? 'Submit collection signature' : 'Submit driver signature';
}

function setupSignaturePad(canvasId){
  canvasId = canvasId || 'sigCanvas';
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const cssHeight = 120;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, rect.width) * dpr;
  canvas.height = cssHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.strokeStyle = '#2A2519';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const pad = { ctx, hasContent: false, drawing: false, lastX: 0, lastY: 0 };
  sigPads[canvasId] = pad;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const cx = (t ? t.clientX : e.clientX) - r.left;
    const cy = (t ? t.clientY : e.clientY) - r.top;
    return { x: cx, y: cy };
  }
  function start(e){
    e.preventDefault();
    pad.drawing = true;
    const p = pos(e);
    pad.lastX = p.x; pad.lastY = p.y;
  }
  function move(e){
    if(!pad.drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(pad.lastX, pad.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    pad.lastX = p.x; pad.lastY = p.y;
    pad.hasContent = true;
  }
  function end(){ pad.drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('touchcancel', end);
}

function clearSignature(canvasId){
  canvasId = canvasId || 'sigCanvas';
  const canvas = document.getElementById(canvasId);
  const pad = sigPads[canvasId];
  if(!canvas || !pad) return;
  pad.ctx.clearRect(0, 0, canvas.width, canvas.height);
  pad.hasContent = false;
}

function getSignatureDataUrl(canvasId){
  canvasId = canvasId || 'sigCanvas';
  const canvas = document.getElementById(canvasId);
  const pad = sigPads[canvasId];
  if(!canvas || !pad || !pad.hasContent) return null;
  return canvas.toDataURL('image/png');
}

function closeModal(){
  document.getElementById('modalLayer').innerHTML = '';
  sigPads = {};
}


function submitDispatch(requireDriverSig){
  const cust = document.getElementById('custInput').value.trim();
  if(!cust){
    document.getElementById('dispErr').style.display = 'block';
    return;
  }
  const collectionToggle = document.getElementById('collectionToggle');
  const isCollection = !!(collectionToggle && collectionToggle.checked);
  const capturedSignature = getSignatureDataUrl('sigCanvas');
  if(requireDriverSig && !capturedSignature){
    const err = document.getElementById('dispErr');
    err.textContent = isCollection ? 'Collector signature required' : 'Driver signature required';
    err.style.display = 'block';
    return;
  }
  const driverName = isCollection ? '' : document.getElementById('driverNameInput').value.trim();
  const vehicleReg = isCollection ? '' : document.getElementById('vehicleRegInput').value.trim();
  const collectorName = isCollection ? document.getElementById('collectorNameInput').value.trim() : '';
  if(dispatchCart.length === 0) return;
  const date = todayStr();
  const noteId = uid();
  const noteItems = [];

  dispatchCart.forEach(c => {
    let item;
    if(c.stockItemId){
      item = state.items.find(x => x.id === c.stockItemId);
      if(!item) return;
      item.status = 'dispatched';
      item.dispatchedDate = date;
      item.noteId = noteId;
    } else {
      consumeFromStatus('ready', c.type, c.qty);
      item = {
        id: uid(), type: c.type, qty: c.qty, ref: c.ref,
        status: 'dispatched',
        addedDate: date,
        vinagedDate: date,
        readyDate: date,
        dispatchedDate: date,
        noteId: noteId
      };
      state.items.push(item);
    }
    noteItems.push({ stockItemId: item.id, type: item.type, qty: item.qty, ref: item.ref });
  });

  // On a collection note the single captured signature IS the receipt
  // signature, so it goes into the site fields (leaving driver fields
  // empty) — that makes isNoteComplete() true right away and the note
  // lands under "Delivered" instead of waiting on a driver handover
  // that never happens.
  const note = {
    id: noteId,
    number: 'DN-' + String(nextNo).padStart(4,'0'),
    date,
    customer: cust,
    items: noteItems,
    isCollection,
    driverSignature: isCollection ? null : (capturedSignature || null),
    driverSignedDate: (!isCollection && capturedSignature) ? date : null,
    driverName,
    vehicleReg,
    siteSignature: isCollection ? (capturedSignature || null) : null,
    siteSignedDate: (isCollection && capturedSignature) ? date : null,
    siteSignedBy: isCollection ? collectorName : ''
  };
  nextNo += 1;
  state.notes.push(note);
  dispatchCart = [];

  save();
  closeModal();
  render();
  viewNote(noteId);
}

function confirmDriverSignaturePending(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  const driverSig = getSignatureDataUrl('pendingDriverSig');
  if(!driverSig){
    document.getElementById('pendingDriverErr').style.display = 'block';
    return;
  }
  const nameInput = document.getElementById('pendingDriverName');
  const regInput = document.getElementById('pendingVehicleReg');
  if(nameInput) note.driverName = nameInput.value.trim();
  if(regInput) note.vehicleReg = regInput.value.trim();
  note.driverSignature = driverSig;
  note.driverSignedDate = todayStr();
  save();
  render();
  viewNote(noteId);
}

function removeNoteItem(noteId, stockItemId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  if(note.items.length <= 1){
    alert('A delivery note needs at least one item. Close this note and add items back to Finished stock manually if you dispatched by mistake.');
    return;
  }
  const stockItem = state.items.find(it => it.id === stockItemId);
  if(stockItem){
    stockItem.status = 'vinaged';
    stockItem.dispatchedDate = null;
    stockItem.noteId = null;
  }
  note.items = note.items.filter(x => x.stockItemId !== stockItemId);
  save();
  render();
  viewNote(noteId);
}

function addFinishedItemToNote(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  const select = document.getElementById('addFromFinished');
  const stockItemId = select.value;
  if(!stockItemId) return;
  const it = state.items.find(x => x.id === stockItemId);
  if(!it) return;
  const date = todayStr();
  it.status = 'dispatched';
  it.dispatchedDate = date;
  it.noteId = noteId;
  note.items.push({ stockItemId: it.id, type: it.type, qty: it.qty, ref: it.ref });
  save();
  render();
  viewNote(noteId);
}

function addAdhocItemToNote(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  const type = document.getElementById('addAdhocType').value;
  const qty = Math.max(1, parseInt(document.getElementById('addAdhocQty').value) || 1);
  const ref = document.getElementById('addAdhocRef').value.trim();
  const date = todayStr();
  consumeFromStatus('vinaged', type, qty);

  const existingLine = note.items.find(x => x.type === type && (x.ref || '') === (ref || ''));
  const existingStockItem = existingLine ? state.items.find(si => si.id === existingLine.stockItemId) : null;
  if(existingLine && existingStockItem){
    existingStockItem.qty += qty;
    existingLine.qty += qty;
  } else {
    const item = {
      id: uid(), type, qty, ref,
      status: 'dispatched',
      addedDate: date,
      vinagedDate: date,
      dispatchedDate: date,
      noteId: noteId
    };
    state.items.push(item);
    note.items.push({ stockItemId: item.id, type, qty, ref });
  }
  save();
  render();
  viewNote(noteId);
}

// ---------- Proof of delivery (2026-09-24) ----------
// Photo of the delivered goods + exact time + GPS position, captured when
// the client signs. The photo goes to Firebase Storage (deliveryPhotos/),
// only its link is stored on the note. A just-taken photo is also kept in
// memory so the PDF made straight after signing includes it.
const deliveryPhotoLocal = {};
function previewDeliveryPhoto(input){
  const img = document.getElementById('siteDeliveryPhotoPreview');
  if(!img) return;
  const f = input.files && input.files[0];
  if(!f){ img.style.display = 'none'; return; }
  img.src = URL.createObjectURL(f);
  img.style.display = 'block';
}
function getSigningLocation(timeoutMs){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(null);
    let done = false;
    const finish = v => { if(!done){ done = true; resolve(v); } };
    setTimeout(() => finish(null), timeoutMs || 8000);
    navigator.geolocation.getCurrentPosition(
      pos => finish({ lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy || 0) }),
      () => finish(null),
      { enableHighAccuracy: true, timeout: timeoutMs || 8000, maximumAge: 60000 }
    );
  });
}
function compressPhoto(file, maxSide){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, (maxSide || 1280) / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve({ blob: b, dataUrl: c.toDataURL('image/jpeg', 0.8) }), 'image/jpeg', 0.8);
    };
    img.onerror = () => resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
async function uploadDeliveryPhoto(note, file){
  const small = await compressPhoto(file, 1280);
  if(!small || !small.blob) return false;
  deliveryPhotoLocal[note.id] = small.dataUrl;
  try{
    const ref = firebase.storage().ref(`deliveryPhotos/${note.number} - ${note.id}.jpg`);
    await ref.put(small.blob, { contentType: 'image/jpeg' });
    note.deliveryPhotoUrl = await ref.getDownloadURL();
    return true;
  }catch(e){
    console.error('Delivery photo upload failed', e);
    alert('The delivery photo could not be uploaded (check the connection). The note is still signed; you can add the photo again with "Edit customer / signature" later if needed.');
    return false;
  }
}
function proofOfDeliveryHtml(note){
  const bits = [];
  if(note.siteSignedAt){
    const d = new Date(note.siteSignedAt);
    bits.push(`Signed ${d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'})} at ${d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}`);
  }
  if(note.siteSignedGeo){
    const g = note.siteSignedGeo;
    bits.push(`GPS <a href="https://maps.google.com/?q=${g.lat},${g.lng}" target="_blank" rel="noopener">${g.lat}, ${g.lng}</a>${g.acc ? ` (±${g.acc} m)` : ''}`);
  } else if(note.siteSignedAt){
    bits.push('GPS not available');
  }
  const photo = deliveryPhotoLocal[note.id] || note.deliveryPhotoUrl;
  return (bits.length ? `<div class="docket-pod" style="font-size:11px;margin-top:6px;opacity:.85;">${bits.join(' · ')}</div>` : '')
    // No crossorigin attribute: Firebase Storage doesn't send CORS headers
    // for downloads, so asking for them would stop the photo showing at all.
    // The PDF made on the signing phone uses the in-memory copy; any later
    // PDF still carries the link to the photo underneath.
    + (photo ? `<div class="docket-photo" style="margin-top:8px;"><img src="${photo}" alt="Delivery photo" style="max-width:100%;max-height:260px;border-radius:6px;"><div class="sig-label">Delivery photo${note.deliveryPhotoUrl ? ` — <a href="${note.deliveryPhotoUrl}" target="_blank" rel="noopener">open full photo</a>` : ''}</div></div>` : '');
}

    const file = (await makeNotePdfFile(note)) || (await generateDocketImage(note));
    if(file && (!navigator.canShare || navigator.canShare({ files: [file] }))){
      try{
        await navigator.share({ files: [file], title: `Delivery note ${note.number}`, text: noteTextLines(note).join('\n') });

      }catch(e){
        if(e && e.name === 'AbortError') return;

  if(isNoteComplete(note) && !note.pdfUrl) await savePdfToFirebase(note);
  const text = noteTextLines(note).join('\n');

// ===================== FIREBASE BOARD SYNC =====================
// RESTORED (2026-09-22) — this got accidentally deleted along with the
// Google Drive code in the same edit that removed Drive (they used to
// sit right next to each other in the file). Unchanged from the
// original 2026-09-09 Firebase migration otherwise: see dev notes
// BOARD DATA SYNC section for the full history.
// ===================== SAFE MERGE SYNC =====================
// Before: every save did firebaseBoardRef.set({...whole board...}) from
// this device's copy, so anything another device or app wrote in the
// meantime (e.g. an item just sent from Stock List / Board Stock /
// Consumables, or a user edited in another app) was silently wiped.
// Now each save works out only what THIS device changed since it last
// heard from the server (added / edited / deleted, matched by id) and
// applies just those changes on top of the server's current data, in a
// transaction so two simultaneous saves can't overwrite each other.
let firebaseBase = null;          // last copy of dispatchBoard this device got from the server
let firebaseDirty = false;        // a local change is waiting for the debounce timer
let firebaseInFlight = false;     // a save is currently being sent
function firebasePushPendingNow(){ return firebaseDirty || firebaseInFlight; }

function syncClone(x){ return x === undefined ? null : JSON.parse(JSON.stringify(x)); }
function syncList(v){
  if(Array.isArray(v)) return v.filter(x => x !== null && x !== undefined);
  if(v && typeof v === 'object') return Object.values(v);
  return [];
}
function mergeSyncList(baseIn, localIn, remoteIn){
  const base = syncList(baseIn), local = syncList(localIn), remote = syncList(remoteIn);
  const all = base.concat(local, remote);
  const byId = all.every(x => x && typeof x === 'object' && x.id !== undefined && x.id !== null);
  if(!byId){
    // Plain lists (driver names, item types): set-style merge.
    const k = x => JSON.stringify(x);
    const baseKeys = new Set(base.map(k)), localKeys = new Set(local.map(k));
    const removedHere = new Set(base.filter(x => !localKeys.has(k(x))).map(k));
    const out = remote.filter(x => !removedHere.has(k(x)));
    const outKeys = new Set(out.map(k));
    local.forEach(x => { if(!baseKeys.has(k(x)) && !outKeys.has(k(x))){ out.push(x); outKeys.add(k(x)); } });
    return out;
  }
  const baseMap = new Map(base.map(x => [x.id, x]));
  const localMap = new Map(local.map(x => [x.id, x]));
  const changedHere = id => {
    const l = localMap.get(id), b = baseMap.get(id);
    return !!l && (!b || JSON.stringify(l) !== JSON.stringify(b));
  };
  const out = [];
  const seen = new Set();
  remote.forEach(r => {
    seen.add(r.id);
    if(baseMap.has(r.id) && !localMap.has(r.id)) return;        // deleted on this device
    out.push(changedHere(r.id) ? localMap.get(r.id) : r);         // edited here wins, otherwise server copy
  });
  local.forEach(l => {
    if(seen.has(l.id)) return;
    if(!baseMap.has(l.id)) { out.push(l); return; }               // added on this device
    if(changedHere(l.id)) out.push(l);                            // edited here but deleted elsewhere: keep the edit
  });
  return out;
}
function mergeBoardData(base, local, remote){
  base = base || {}; remote = remote || {};
  return {
    items: mergeSyncList(base.items, local.items, remote.items),
    notes: mergeSyncList(base.notes, local.notes, remote.notes),
    users: mergeSyncList(base.users, local.users, remote.users),
    drivers: mergeSyncList(base.drivers, local.drivers, remote.drivers),
    itemTypes: mergeSyncList(base.itemTypes, local.itemTypes, remote.itemTypes),
    nextNo: Math.max(Number(remote.nextNo) || 0, Number(local.nextNo) || 0) || 1
  };
}
function localBoardData(){
  return { items: state.items, notes: state.notes, nextNo, itemTypes, users, drivers };
}

function initFirebaseBoardSync(){
  return new Promise((resolve) => {
    firebase.database().ref('.info/connected').on('value', (snap) => {
      firebaseConnected = snap.val() === true;
      updateSyncUi();
    });

    firebaseBoardRef = firebase.database().ref('dispatchBoard');
    firebaseBoardRef.on('value', (snapshot) => {
      const remote = snapshot.val();
      if(remote){
        // If this device has a change still waiting to be saved, keep it
        // (re-applied on top of the server's newer data) instead of
        // throwing it away.
        const applied = (firebasePushPendingNow() && firebaseBase)
          ? mergeBoardData(firebaseBase, localBoardData(), remote)
          : remote;
        firebaseBase = syncClone(remote);
        state.items = syncList(applied.items);
        state.notes = syncList(applied.notes);
        nextNo = applied.nextNo || (state.notes.length + 1);
        itemTypes = (applied.itemTypes && syncList(applied.itemTypes).length) ? syncList(applied.itemTypes) : itemTypes;
        users = applied.users ? syncList(applied.users) : users;
        drivers = applied.drivers ? syncList(applied.drivers) : drivers;
        renderTypeSelects();
        renderDriverOptions();
        render();
        renderUserBadge();
        applyPermissionsToUi();
        persistLocal();
      }
      if(!firebaseFirstSnapshotReceived){
        firebaseFirstSnapshotReceived = true;
        resolve();
      }
    }, () => {
      // permission-denied or similar — don't hang load() forever waiting
      if(!firebaseFirstSnapshotReceived){
        firebaseFirstSnapshotReceived = true;
        resolve();
      }
    });
  });
}

function pushBoardToFirebase(){
  if(!firebaseBoardRef) return;
  const local = syncClone(localBoardData());
  const base = firebaseBase;
  firebaseDirty = false;
  firebaseInFlight = true;
  firebaseBoardRef.transaction(current => {
    if(!current) return local;                  // nothing on the server yet
    return mergeBoardData(base, local, current); // only this device's changes, on top of the latest data
  }).then(res => {
    firebaseInFlight = false;
    if(res && res.committed && res.snapshot) firebaseBase = syncClone(res.snapshot.val());
    firebaseConnected = true;
    updateSyncUi();
  }).catch(err => {
    firebaseInFlight = false;
    firebaseDirty = true;                       // keep the change; it'll be retried on the next save
    console.error('Dispatch save failed', err);
    firebaseConnected = false;
    updateSyncUi();
  });
}

// Debounces rapid-fire saves (e.g. typing in a field that autosaves on
// every keystroke) into a single write ~800ms after the last change,
// same spirit as the old jsonbin queueCloudSync but without any of the
// rate-limit concerns that required — Firebase's free tier is nowhere
// near a constraint at this app's scale.
function queuePushToFirebase(){
  firebaseDirty = true;
  clearTimeout(firebasePushTimer);
  firebasePushTimer = setTimeout(pushBoardToFirebase, 800);
}

// REPLACED Google Drive entirely (2026-09-22), per user request — Drive's
// client-side OAuth has no way to reconnect indefinitely without asking
// again eventually (see the removed tryAutoReconnectDrive's own comment
// for the full explanation: no refresh tokens without a real backend
// server, and browsers increasingly block even the silent reconnect
// check). Firebase Storage uses the exact same open, no-login connection
// this app already has to the Realtime Database — no per-person sign-in
// at all, so there is nothing left to "reconnect." A locked note's PDF
// just uploads in the background the moment it's completed.
//
// ONE-TIME SETUP THIS NEEDS IN THE FIREBASE CONSOLE (can't be done from
// here): open the project -> Storage -> get started (Spark/free plan is
// fine) -> Rules tab -> set to `allow read, write: if true;` the same
// open-access trust model already accepted for the Realtime Database
// rules. Until that's done, PDF uploads will fail silently (the note
// still locks/signs fine either way — this is purely the archive copy).
function generateDocketPdfBlob(){
  const printArea = document.getElementById('printArea');
  if(!printArea || !window.html2canvas || !window.jspdf) return null;
  return html2canvas(printArea, { backgroundColor: '#F3EEDF', scale: 2, useCORS: true }).then((canvas) => {
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'px', format: [canvas.width, canvas.height] });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    return pdf.output('blob');
  });
}

async function savePdfToFirebase(note){
  try{
    const pdfBlob = await generateDocketPdfBlob();
    if(!pdfBlob) return { ok: false, reason: 'render-failed' };
    const fileName = `${note.number} - ${note.customer}.pdf`;
    const ref = firebase.storage().ref('deliveryNotes/' + fileName);
    await ref.put(pdfBlob, { contentType: 'application/pdf' });
    note.pdfUrl = await ref.getDownloadURL();
    await save(); // was persistLocal() — the PDF link never reached other devices
    return { ok: true };
  }catch(e){
    console.error('PDF archive upload failed', e);
    return { ok: false, reason: 'error' };
  }
}

async function manualSavePdf(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  const result = await savePdfToFirebase(note);
  if(result.ok){
    render();
    viewNote(noteId);
  } else {
    alert('Could not save a PDF copy — check your connection and try again. If this keeps happening, Firebase Storage may not be enabled yet for this project (see dev notes).');
  }
}

async function attemptLogin(userId){
  const u = users.find(x => x.id === userId);
  if(!u) return;

  const rec = loginAttempts[userId] || { count: 0, lockedUntil: 0 };
  if(rec.lockedUntil && Date.now() < rec.lockedUntil){
    const secsLeft = Math.ceil((rec.lockedUntil - Date.now()) / 1000);
    const err = document.getElementById('loginErr');
    err.textContent = `Too many wrong attempts. Try again in ${secsLeft}s.`;
    err.style.display = 'block';
    return;
  }

  const entered = document.getElementById('pinInput').value;
  const enteredHash = await hashPin(entered);
  if(enteredHash !== u.pin){
    rec.count += 1;
    if(rec.count >= MAX_LOGIN_ATTEMPTS){
      rec.lockedUntil = Date.now() + LOCKOUT_MS;
      rec.count = 0;
    }
    loginAttempts[userId] = rec;
    const err = document.getElementById('loginErr');
    err.textContent = rec.lockedUntil && Date.now() < rec.lockedUntil
      ? `Too many wrong attempts. Try again in ${Math.ceil(LOCKOUT_MS/1000)}s.`
      : "Incorrect PIN. Ask your admin to reset it if you've forgotten it.";
    err.style.display = 'block';
    return;
  }

  delete loginAttempts[userId];
  currentUserId = u.id;
  try{ await storage.set('currentUserId', u.id, false); }catch(e){}
  hideLoginOverlay();
  renderUserBadge();
  applyPermissionsToUi();
  resetIdleTimer();
}

  const pinHash = await hashPin(pin);
  // First account ever created on this board is the MAIN root: the
  // only one that can reach every app and grant app access to others.
  const rootUser = { id: uid(), username, pin: pinHash, isRoot: true, isMainRoot: true, permissions: defaultPermissions(), apps: defaultApps() };
  users.push(rootUser);
  currentUserId = rootUser.id;
  try{ await storage.set('currentUserId', rootUser.id, false); }catch(e){}
  save();
  hideLoginOverlay();
  renderUserBadge();
  applyPermissionsToUi();
  resetIdleTimer();
}

async function saveUserForm(editId){
  const username = document.getElementById('userFormUsername').value.trim();
  const pin = document.getElementById('userFormPin').value;
  const isRoot = document.getElementById('userFormRoot').checked;
  const err = document.getElementById('userFormErr');
  err.style.display = 'none';
  if(!username){
    err.textContent = 'Enter a username.';
    err.style.display = 'block';
    return;
  }
  if(!editId && pin.length < 4){
    err.textContent = 'Enter a PIN of at least 4 characters.';
    err.style.display = 'block';
    return;
  }
  if(pin && pin.length < 4){
    err.textContent = 'PIN must be at least 4 characters (or leave it blank to keep the current one).';
    err.style.display = 'block';
    return;
  }
  if(users.some(u => u.username.toLowerCase() === username.toLowerCase() && u.id !== editId)){
    err.textContent = 'That username is already taken.';
    err.style.display = 'block';
    return;
  }
  // FIXED 2026-09-09: same fix as the Stock List app's saveUserForm —
  // start from the existing user's permissions when editing (not a
  // fresh defaultPermissions()) so any key only the OTHER app's form
  // shows checkboxes for (there currently are none the other direction,
  // but this makes it safe either way) isn't silently wiped on save.
  const existingUser = editId ? users.find(u => u.id === editId) : null;
  const permissions = existingUser ? {...defaultPermissions(), ...existingUser.permissions} : defaultPermissions();
  document.querySelectorAll('.permCheck').forEach(cb => { permissions[cb.dataset.key] = cb.checked; });

  // App access is main-root-only. For anyone else the checkboxes are
  // disabled, so we deliberately ignore the DOM and carry the existing
  // values through — a secondary root editing a user must not be able
  // to widen (or narrow) which apps that user can reach.
  let apps;
  if(currentUserIsMainRoot()){
    apps = {};
    document.querySelectorAll('.appCheck').forEach(cb => { apps[cb.dataset.app] = cb.checked; });
  } else {
    apps = existingUser ? (existingUser.apps || defaultApps()) : defaultApps();
  }

  if(editId){
    const u = users.find(x => x.id === editId);
    if(u){
      if(isMainRoot(u) && !currentUserIsMainRoot()) return; // belt and braces
      u.username = username;
      if(pin) u.pin = await hashPin(pin);
      // The main root always stays root and always keeps every app.
      u.isRoot = isMainRoot(u) ? true : isRoot;
      u.permissions = permissions;
      u.apps = isMainRoot(u) ? defaultApps() : apps;
    }
  } else {
    users.push({ id: uid(), username, pin: await hashPin(pin), isRoot, permissions, apps });
  }
  save();
  renderUserBadge();
  applyPermissionsToUi();
  openManageUsers();
}

function deleteUser(userId){
  const target = users.find(u => u.id === userId);
  if(!target) return;
  if(isMainRoot(target)){
    alert("You can't delete the main root account.");
    return;
  }
  if(target.isRoot && users.filter(u => u.isRoot).length <= 1){
    alert("You can't delete the only root account — make another user root first.");
    return;
  }
  if(userId === currentUserId){
    alert("You can't delete the account you're currently logged in as. Switch to another user first.");
    return;
  }
  if(!confirm(`Remove ${target.username}?`)) return;
  users = users.filter(u => u.id !== userId);
  save();
  openManageUsers();
}

}
function isInStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!isInStandaloneMode() && installBtn) installBtn.style.display = '';
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  if(installBtn) installBtn.style.display = 'none';
});

// iOS never fires beforeinstallprompt, so show the button unconditionally
// there (unless already running as an installed home-screen app) unlike
// the Android/desktop path above which waits for that event.
if(isIos() && !isInStandaloneMode() && installBtn){
  installBtn.style.display = '';
}

if(installBtn){
  installBtn.addEventListener('click', async () => {
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if(choice.outcome === 'accepted') installBtn.style.display = 'none';
      return;
    }
    if(isIos()){
      const layer = document.getElementById('modalLayer');
      layer.innerHTML = `<div class="modal-bg" id="iosInstallBg">
        <div class="modal" style="max-width:360px;">
          <h3>Install Dispatch</h3>
          <div class="hint">iPhone/iPad doesn't support one-tap install from the app itself — a couple of manual taps in Safari does the same thing:</div>
          <div style="font-size:13px;line-height:1.7;">
            1. Tap the <b>Share</b> button (the square with an arrow) in Safari's toolbar.<br>
            2. Scroll down and tap <b>Add to Home Screen</b>.<br>
            3. Tap <b>Add</b> in the top right.
          </div>
          <div class="modal-actions">
            <button class="btn btn-primary" onclick="closeModal()">Got it</button>
          </div>
        </div>
      </div>`;
      return;
    }
    alert("Your browser doesn't support installing this app directly. Look for an 'Install' or 'Add to Home Screen' option in your browser's menu.");
  });
}

load();
</script>
</body>
</html>
