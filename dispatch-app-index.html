KEY BUSINESS RULES (do not regress these without the user asking)
1. isNoteComplete() = true iff the note has a SITE signature. Driver
   signature does NOT lock it. Deliberate: driver can sign & save,
   note stays fully editable until the site signature lands — that is
   the one action that locks it.
2. A pending (unlocked) note lets you: add items from Finished stock or
   ad-hoc, remove items (min 1 must remain), edit customer name,
   capture/redo driver signature independently ("Save driver
   signature", no site signature needed at the same time), and capture
   the site signature independently ("Submit site signature & lock").
3. A locked note cannot have items, customer, or signatures changed via
   the normal Edit screen — that button disappears once locked. The
   ONE exception is "Edit signing details" (openSigningDetails /
   saveSigningDetails) — always available, locked or not, old or new —
   which only touches: driver name, vehicle registration, site signer
   name, driver signed date, site signed date. Never items, customer,
   or the signature images. Exists so old notes can be backfilled
   without reopening the whole note.
   ROOT OVERRIDE (2026-09-02): root users are the one exception to the
   whole lock. In viewNote(), `rootOverride = complete && current user
   isRoot` — when true, the pending/editable branch renders instead of
   the read-only docket branch (item add/remove, "Edit customer /
   signature" via openEditNote, and a re-signable site-signature
   canvas whose button reads "Update site signature" instead of
   "...& lock"), plus the normally-read-only-view's Print/Email/
   WhatsApp/Save-to-Drive buttons are added alongside so root doesn't
   lose those. No banner or other indicator distinguishes this from the
   normal pending-note edit view (removed per user request 2026-09-02)
   — the only visible difference is the extra share/print/Drive buttons
   and the site-signature button's label.
   None of the underlying mutators (removeNoteItem, addFinishedItemToNote,
   addAdhocItemToNote, confirmSiteSignature, openEditNote/saveEditedNote)
   actually check isNoteComplete themselves — the lock was always a UI-only
   gate in viewNote() — so no changes were needed there, only to which
   branch of viewNote() root sees.
4. Adding stock (Unfinished, Finished, delivery-note cart lines, or ad-hoc
   additions to a pending note) merges into an existing card with the
   same type + reference instead of duplicating — see
   findMergeTarget(). "Combine duplicates" does a one-time bulk merge
   of Unfinished/Finished only (not Dispatched — those are tied 1:1 to
   specific note line items).
5. Removing a stock item (× on a card) prompts for a quantity rather
   than always deleting the whole card — see removeItem(). Finished
   removals are meant for damaged/written-off stock.
6. Delivery notes support MULTIPLE items per note via a cart
   (dispatchCart — see addToDispatchCart / renderCartPanel). Finished
   cards say "Add to delivery note" to stage them; the Dispatched
   column's quick-add form stages ad-hoc lines the same way. "Review &
   sign" opens the driver-signature step for the whole cart at once.
7. A new note can be created with NO signature via "Save for now"
   (submitDispatch(false)) — items still move to Dispatched, note just
   isn't signed yet.

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dispatch</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E1C18; --panel:#26221C; --panel-2:#2E2A22; --line:#433D32;
    --text:#EFE8D8; --muted:#9C9280; --faint:#6E6656;
    --amber:#E3A23A; --amber-dim:#3B2E1A;
    --green:#5FA776; --green-dim:#1E2B22;
    --rust:#C1613D; --rust-dim:#33221B;
    --font-d:'Barlow Condensed',sans-serif;
    --font-b:'Inter',sans-serif;
    --font-m:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-b);margin:0;padding:28px 24px 60px;padding-bottom:calc(60px + env(safe-area-inset-bottom));}
  h1{font-family:var(--font-d);font-weight:700;font-size:34px;letter-spacing:.02em;margin:0;text-transform:uppercase;}
  .sub{font-family:var(--font-m);color:var(--faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
  .topline{margin-bottom:18px;}
  .toolbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .topline h1{color:#F3EEDF;}
  .topline .sub{color:#DCD5C0;}
  button{font-family:var(--font-b);cursor:pointer;}
  .btn{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:3px;font-size:13px;font-weight:500;transition:.15s;}
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn-primary{background:var(--amber);border-color:var(--amber);color:#241a08;font-weight:600;}
  .btn-primary:hover{background:#eeb055;color:#241a08;}
  .btn-green{background:var(--green);border-color:var(--green);color:#0f1c14;font-weight:600;}
  .btn-green:hover{background:#72bd88;}
  .btn-rust{background:transparent;border:1px solid var(--rust);color:var(--rust);}
  .btn-rust:hover{background:var(--rust);color:#2a160e;}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .addbar{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-family:var(--font-m);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  select,input[type=text],input[type=number]{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:3px;font-family:var(--font-b);font-size:13px;min-width:140px;}
  select:focus,input:focus{outline:none;border-color:var(--amber);}
  input[type=number]{min-width:70px;}

  .board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:900px){.board{grid-template-columns:1fr;}}
  @media(max-width:640px){
    body{padding:18px 14px 60px;padding-bottom:calc(60px + env(safe-area-inset-bottom));}
    h1{font-size:28px;}
    .header-card{flex-direction:column;align-items:flex-start;gap:14px;}
    .header-card .lh-divider{display:none;}
    .header-card .lh-logo{align-items:flex-start;}
    .toolbar{flex-direction:column;}
    .toolbar .btn{width:100%;}
    .addbar{flex-direction:column;align-items:stretch;}
    .addbar .field{width:100%;}
    select,input[type=text],input[type=number]{width:100%;font-size:16px;padding:10px;}
    .btn{padding:10px 14px;font-size:14px;}
    .modal{max-width:100%;}
  }
  .col{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:120px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);}
  .col-head h2{font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:0;}
  .count{font-family:var(--font-m);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:1px 9px;color:var(--muted);}
  .col.unvinaged .col-head{border-top:3px solid var(--faint);}
  .col.vinaged .col-head{border-top:3px solid var(--amber);}
  .col.dispatched .col-head{border-top:3px solid var(--green);}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:10px;}
  .col-add{background:var(--panel-2);border:1px dashed var(--line);border-radius:4px;padding:10px;margin:10px 10px 0;display:flex;flex-direction:column;gap:8px;}
  .col-add .field{width:100%;}
  .col-add select,.col-add input{width:100%;min-width:0;}
  .col-add .btn{width:100%;text-align:center;}
  .empty{color:var(--faint);font-size:12px;font-family:var(--font-m);padding:16px 6px;text-align:center;}

  .card{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:4px;padding:11px 12px;}
  .col.vinaged .card{border-left-color:var(--amber);}
  .col.dispatched .card{border-left-color:var(--green);opacity:.9;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-type{font-family:var(--font-d);font-size:18px;font-weight:600;line-height:1.1;}
  .card-qty{font-family:var(--font-m);font-size:12px;color:var(--muted);white-space:nowrap;}
  .card-ref{font-size:12px;color:var(--muted);margin-top:2px;}
  .spec{margin:8px 0 0;padding:8px 9px;background:var(--bg);border:1px dashed var(--line);border-radius:3px;font-size:11.5px;color:var(--muted);line-height:1.55;}
  .spec div{display:flex;gap:6px;}
  .spec .tag{color:var(--faint);min-width:14px;}
  .card-dates{font-family:var(--font-m);font-size:10.5px;color:var(--faint);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;}
  .card-actions{margin-top:10px;display:flex;gap:8px;}
  .del{background:none;border:none;color:var(--faint);font-size:16px;line-height:1;padding:0 2px;}
  .del:hover{color:var(--rust);}

  .modal-wrap{position:relative;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;}
  .modal h3{font-family:var(--font-d);font-size:22px;text-transform:uppercase;margin:0 0 4px;}
  .modal .hint{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;}

  .docket{background:#F3EEDF;color:#2A2519;border:1px solid #B9AF93;border-radius:4px;padding:22px 24px;position:relative;font-family:var(--font-b);}
  .docket:before{content:"";position:absolute;top:0;left:22px;right:22px;border-top:2px dashed #B9AF93;}
  .docket-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #2A2519;padding-bottom:10px;margin-bottom:14px;}
  .docket-head h3{font-family:var(--font-d);font-size:26px;text-transform:uppercase;margin:0;letter-spacing:.02em;}
  .header-card{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#78756E;color:#F3EEDF;border-radius:10px;padding:16px 20px;}
  .header-card .lh-left{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .header-card .lh-name{font-family:var(--font-b);font-size:18px;font-weight:600;letter-spacing:.01em;color:#F3EEDF;}
  .header-card .lh-reg{font-family:var(--font-m);font-size:10px;color:#DCD5C0;letter-spacing:.02em;margin-top:2px;}
  .header-card .lh-addr{font-size:11.5px;color:#DCD5C0;margin-top:1px;}
  .header-card .lh-divider{align-self:stretch;width:1px;background:rgba(243,238,223,.35);flex-shrink:0;}
  .header-card .lh-logo{display:flex;flex-direction:column;align-items:flex-end;line-height:1;flex-shrink:0;}
  .header-card .lh-logo .lh-oak{font-family:var(--font-b);font-weight:300;font-size:25px;letter-spacing:.3em;color:#F3EEDF;}
  .header-card .lh-logo .lh-joinery{font-family:var(--font-b);font-weight:500;font-size:9.5px;letter-spacing:.38em;color:#F3EEDF;margin-top:5px;}
  .docket-letterhead{margin-bottom:16px;}
  .docket-num{font-family:var(--font-m);font-size:12px;color:#5A5238;}
  .docket-date{font-family:var(--font-m);font-size:13px;border:1px solid #2A2519;border-radius:3px;padding:4px 9px;transform:rotate(-2deg);display:inline-block;}
  .docket{overflow:hidden;width:100%;}
  .docket-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#5A5238;margin-bottom:2px;}
  .docket-row span:first-child{flex-shrink:0;}
  .docket-row span:last-child{text-align:right;overflow-wrap:anywhere;}
  .docket-items{margin-top:14px;border-top:1px solid #B9AF93;padding-top:10px;}
  .docket-items-header{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8a8060;padding-bottom:5px;border-bottom:1px solid #B9AF93;margin-bottom:2px;}
  .docket-items-header .num-col{flex-shrink:0;width:20px;}
  .docket-items-header .qty-col{flex-shrink:0;width:34px;text-align:center;}
  .docket-items-header .desc-col{flex:1;min-width:0;}
  .docket-item{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px dotted #B9AF93;}
  .docket-item .num-col{flex-shrink:0;width:20px;color:#8a8060;}
  .docket-item .qty-col{flex-shrink:0;width:34px;text-align:center;font-weight:600;border-left:1px solid #B9AF93;border-right:1px solid #B9AF93;}
  .docket-item .desc-col{flex:1;min-width:0;overflow-wrap:anywhere;}
  .docket-item .spec{background:transparent;border:none;color:#5A5238;padding:2px 0 0;margin:0;}
  .docket-sig{margin-top:16px;padding-top:12px;border-top:1px solid #B9AF93;}
  .docket-sig img{display:block;max-width:220px;height:auto;}
  .docket-sig .sig-label{font-family:var(--font-m);font-size:10px;color:#5A5238;text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

  .sigwrap{background:#F3EEDF;border:1px solid var(--line);border-radius:4px;overflow:hidden;touch-action:none;}
  .sigwrap canvas{display:block;width:100%;height:120px;touch-action:none;}
  .sig-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .sig-hint{font-family:var(--font-m);font-size:10.5px;color:var(--faint);}

  .drive-btn{display:flex;align-items:center;gap:7px;}

  .cart-panel{background:var(--amber-dim);border:1px solid var(--amber);border-radius:4px;margin:10px 10px 0;padding:10px;}
  .cart-title{font-family:var(--font-m);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .cart-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed rgba(227,162,58,.3);}
  .cart-line:last-of-type{border-bottom:none;}
  .cart-line .rm{background:none;border:none;color:var(--faint);font-size:15px;line-height:1;cursor:pointer;padding:0 2px;}
  .cart-line .rm:hover{color:var(--rust);}
  .cart-panel .btn{width:100%;margin-top:8px;}

  .note-item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted #B9AF93;}
  .note-item-row .num-col{flex-shrink:0;width:20px;color:#8a8060;}
  .note-item-row .qty-col{flex-shrink:0;width:34px;text-align:center;font-weight:600;border-left:1px solid #B9AF93;border-right:1px solid #B9AF93;}
  .note-item-row .desc-col{flex:1;min-width:0;overflow-wrap:anywhere;}
  .note-item-row .rm-col{flex-shrink:0;width:18px;text-align:right;}
  .note-item-row .rm{background:none;border:none;color:#8a8060;font-size:16px;line-height:1;cursor:pointer;padding:0 2px;}
  .note-item-row .rm:hover{color:var(--rust);}
  .add-item-row{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .drive-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;}
  .drive-dot.on{background:var(--green);}
  .drive-dot.syncing{background:var(--amber);}
  .drive-dot.err{background:var(--rust);}

  .login-overlay{position:fixed;inset:0;background:var(--bg,#14110c);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px;width:100%;max-width:360px;}
  .login-card h3{font-family:var(--font-d);font-size:22px;text-transform:uppercase;margin:0 0 6px;}
  .login-card .hint{font-size:12px;color:var(--muted);margin-bottom:18px;}
  .user-pick-btn{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:4px;font-size:14px;margin-bottom:8px;cursor:pointer;}
  .user-pick-btn:hover{border-color:var(--amber);color:var(--amber);}
  .user-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .user-badge b{color:var(--text);}
  .user-badge button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:0;}
  .user-badge button:hover{color:var(--amber);}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:14px 0;}
  .perm-grid label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:400;}
  .user-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .user-row .who{font-size:13px;}
  .user-row .who .tag{font-size:10.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-left:6px;}
  .user-row .acts{display:flex;gap:8px;flex-shrink:0;}
  .user-row .acts button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
  .user-row .acts button:hover{color:var(--amber);}
  .one-off-toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:400;color:var(--muted);margin-top:5px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
    .modal-actions{display:none;}
  }
</style>
</head>
<body>

<div id="loginOverlay"></div>

<div class="topline">
  <div class="header-card">
    <div class="lh-left">
      <h1 style="font-size:22px;">Dispatch</h1>
      <div class="sub" id="dateline">—</div>
    </div>
    <div class="lh-divider"></div>
    <div class="lh-logo">
      <span class="lh-oak">OAK</span>
      <span class="lh-joinery">JOINERY</span>
    </div>
  </div>
  <div class="user-badge" id="userBadge" style="margin-top:8px;"></div>
</div>

<div class="toolbar">
  <button class="btn drive-btn" id="syncBtn"><span class="drive-dot" id="cloudDot"></span><span id="cloudLabel">Sync across devices</span></button>
  <button class="btn drive-btn" id="driveBtn"><span class="drive-dot" id="driveDot"></span><span id="driveLabel">Google Drive</span></button>
  <button class="btn" id="manageTypesBtn">Manage items</button>
  <button class="btn" id="exportBtn">Download today's sheet</button>
  <button class="btn" id="combineBtn">Combine duplicates</button>
  <button class="btn" id="notesBtn">Delivery notes (<span id="notesCount">0</span>)</button>
  <button class="btn" id="manageUsersBtn">Manage users</button>
</div>

<div class="addbar" id="addbarMain">
  <div class="field">
    <label>Item</label>
    <input type="text" id="typeCustomInput" list="itemTypesList" placeholder="Item description">
    <label class="one-off-toggle"><input type="checkbox" id="typeCustomToggle"> Add to list</label>
  </div>
  <datalist id="itemTypesList"></datalist>
  <div class="field">
    <label>Qty</label>
    <input type="number" id="qtyInput" value="1" min="1">
  </div>
  <div class="field" style="flex:1;">
    <label>Reference / job</label>
    <input type="text" id="refInput" value="NH Hotel">
  </div>
  <button class="btn btn-primary" id="addBtn">+ Add to unfinished</button>
</div>

<div class="board">
  <div class="col unvinaged">
    <div class="col-head"><h2>Unfinished</h2><span class="count" id="cnt-unvinaged">0</span></div>
    <div class="col-body" id="col-unvinaged"></div>
  </div>
  <div class="col vinaged">
    <div class="col-head"><h2>Finished</h2><span class="count" id="cnt-vinaged">0</span></div>
    <div class="col-add" id="addbarFin">
      <input type="text" id="typeCustomInputFin" list="itemTypesList" placeholder="Item description">
      <label class="one-off-toggle"><input type="checkbox" id="typeCustomToggleFin"> Add to list</label>
      <input type="number" id="qtyInputFin" value="1" min="1">
      <input type="text" id="refInputFin" value="NH Hotel">
      <button class="btn btn-green" id="addBtnFin">+ Add to finished</button>
    </div>
    <div class="col-body" id="col-vinaged"></div>
  </div>
  <div class="col dispatched">
    <div class="col-head"><h2>Dispatched</h2><span class="count" id="cnt-dispatched">0</span></div>
    <div id="archivedHint" style="font-size:11.5px;color:var(--muted);margin:-4px 0 8px;display:none;"></div>
    <div id="cartPanel"></div>
    <div class="col-add" id="addbarDis">
      <input type="text" id="typeCustomInputDis" list="itemTypesList" placeholder="Item description">
      <label class="one-off-toggle"><input type="checkbox" id="typeCustomToggleDis"> Add to list</label>
      <input type="number" id="qtyInputDis" value="1" min="1">
      <input type="text" id="refInputDis" value="NH Hotel">
      <button class="btn btn-primary" id="addBtnDis">+ Add item to delivery note</button>
    </div>
    <div class="col-body" id="col-dispatched"></div>
  </div>
</div>

<div id="modalLayer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SPECS = {
  "Bedside Pedestal 500mm": null,
  "Bedside Pedestal 600mm": null,
  "Head Board Left Handed": null,
  "Head Board Right Handed": null,
  "Cushioned Fabric Headboard Panel": null,
  "TV Panel Left Handed": [
    "Mirror panel fitted"
  ],
  "TV Panel Right Handed": [
    "Mirror panel fitted"
  ],
  "Aluminium Flat Bar 2206x38": null,
  "Aluminium Flat Bar 2813x38": null,
  "Aluminium Flat Bar 2813x19": null,
  "Wet Bar Left Handed": [
    "Doors fitted",
    "Handles fitted"
  ],
  "Wet Bar Right Handed": [
    "Doors fitted",
    "Handles fitted"
  ],
  "Hanging Rail 1011mm": null,
  "Mirrors": null,
  "Glass Shelves": null
};

const DEFAULT_ITEM_TYPES = [
  "Bedside Pedestal 500mm",
  "Bedside Pedestal 600mm",
  "Head Board Left Handed",
  "Head Board Right Handed",
  "Cushioned Fabric Headboard Panel",
  "TV Panel Left Handed",
  "TV Panel Right Handed",
  "Aluminium Flat Bar 2206x38",
  "Aluminium Flat Bar 2813x38",
  "Aluminium Flat Bar 2813x19",
  "Wet Bar Left Handed",
  "Wet Bar Right Handed",
  "Hanging Rail 1011mm",
  "Mirrors",
  "Glass Shelves"
];

let state = { items: [], notes: [] };
let itemTypes = DEFAULT_ITEM_TYPES.slice();
let nextNo = 1;
let drive = { clientId: '', status: 'disconnected' }; // status: disconnected|connected|syncing|error — Drive is used ONLY for PDF archiving, see dev notes
let driveAccessToken = null;
let tokenClient = null;
let cloudSync = { apiKey: '', binId: '' }; // jsonbin.io — board data sync, independent of Drive
let cloudSyncStatus = 'disconnected'; // disconnected|syncing|connected|error
let cloudSyncTimer = null;
let cloudPollTimer = null;

// Users & permissions — client-side only (not a real security boundary,
// see dev notes). Root always has every permission regardless of the
// permissions object.
let users = []; // { id, username, pin, isRoot, permissions:{...} }
let currentUserId = null;

function defaultPermissions(){
  return {
    addItems: false,      // Add forms (Unfinished/Finished/Dispatched) + one-off items
    removeItems: false,   // × delete button on cards
    moveItems: false,     // Mark finished, Add to delivery note (stage into cart)
    manageNotes: false,   // Delivery notes list, review & sign, edit signing details
    manageTypes: false,   // Manage items (item catalog)
    exportData: false,    // Download today's sheet, Combine duplicates
    manageSync: false,    // Sync across devices + Google Drive settings
    manageUsers: false    // Add/edit/remove users (root always has this)
  };
}

function getCurrentUser(){

// HTML-escapes any user-supplied text (item descriptions, references,
// usernames, delivery-note fields) before it's inserted via innerHTML,
// to stop stored XSS — e.g. someone typing <img onerror=...> as an item
// description or delivery note field. ALWAYS wrap user-typed strings in
// this before interpolating into an innerHTML template. See dev notes.
function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// PINs are stored as SHA-256 hashes, never plaintext — so reading the
// synced jsonbin data (or the board's local storage) doesn't hand
// someone every PIN in one go. Still not a real security boundary (a
// short numeric PIN is crackable if someone gets the hash and really
// wants it), but it's a meaningful step up from plaintext.
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

  async get(key){
    const v = window.localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    window.localStorage.setItem(key, value);
    return { key, value };
  }
};

async function load(){
  try{
    const res = await storage.get('board', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.items = parsed.items || [];
      state.notes = parsed.notes || [];
      nextNo = parsed.nextNo || (state.notes.length + 1);
      itemTypes = (parsed.itemTypes && parsed.itemTypes.length) ? parsed.itemTypes : DEFAULT_ITEM_TYPES.slice();
      users = parsed.users || [];
      if(parsed.drive){
        drive.clientId = parsed.drive.clientId || '';
      }
      if(parsed.sync){
        cloudSync.apiKey = parsed.sync.apiKey || '';
        cloudSync.binId = parsed.sync.binId || '';
      }
    }
  }catch(e){ }
  renderTypeSelects();
  render();
  updateDriveUi();
  if(drive.clientId) tryAutoReconnectDrive();

  updateSyncUi();
  if(cloudSync.apiKey && cloudSync.binId){
    await pullFromCloud(true);
    startCloudPolling();
  }

  await checkLogin();
}

async function save(){
  try{
    await storage.set('board', JSON.stringify({items: state.items, notes: state.notes, nextNo, itemTypes, users, drive: {clientId: drive.clientId}, sync: {apiKey: cloudSync.apiKey, binId: cloudSync.binId}}), false);

}

function cardHtml(it, status){

  if(status === 'unvinaged'){
    actions = can('moveItems') ? `<button class="btn btn-green btn-sm" onclick="markVinaged('${it.id}')">Mark finished</button>` : '';
  } else if(status === 'vinaged'){
    dates += `<span>Finished ${it.vinagedDate}</span>`;
    const inCart = dispatchCart.some(c => c.stockItemId === it.id);
    if(!can('moveItems')){
      actions = '';
    } else {
      actions = inCart
        ? `<button class="btn btn-sm" disabled style="opacity:.5;">In delivery note</button>`
        : `<button class="btn btn-primary btn-sm" onclick="addToDispatchCart('${it.id}')">Add to delivery note</button>`;
    }
  } else {
    dates += `<span>Finished ${it.vinagedDate}</span><span>Dispatched ${it.dispatchedDate}</span>`;
    const note = state.notes.find(n => n.id === it.noteId);
    const complete = note ? isNoteComplete(note) : true;
    actions = can('manageNotes')
      ? (complete
        ? `<button class="btn btn-sm" onclick="viewNote('${it.noteId}')">View delivery note</button>`
        : `<button class="btn btn-primary btn-sm" onclick="viewNote('${it.noteId}')">Complete signature</button>`)
      : '';
  }
  const canRemoveHere = can('removeItems') && (status==='unvinaged' || (status==='vinaged' && !dispatchCart.some(c => c.stockItemId === it.id)));
  return `<div class="card">
    <div class="card-top">
      <div>
        <div class="card-type">${escHtml(it.type)}</div>
        ${it.ref ? `<div class="card-ref">${escHtml(it.ref)}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="card-qty">x${it.qty}</span>
        ${canRemoveHere ? `<button class="del" title="Remove" onclick="removeItem('${it.id}')">&times;</button>` : ''}
      </div>
    </div>
    ${specHtml(it.type)}
    <div class="card-dates">${dates}</div>
    <div class="card-actions">${actions}</div>
  </div>`;
}

function combineDuplicates(){
  if(!can('exportData')) return;
  let mergedCount = 0;
  ['unvinaged', 'vinaged'].forEach(status => {
    const groups = {};
    state.items.filter(it => it.status === status).forEach(it => {
      const key = it.type + '|' + (it.ref || '');
      (groups[key] = groups[key] || []).push(it);
    });
    Object.values(groups).forEach(group => {
      if(group.length <= 1) return;
      const keeper = group[0];
      for(let i = 1; i < group.length; i++){
        keeper.qty += group[i].qty;
        state.items = state.items.filter(x => x.id !== group[i].id);
        mergedCount++;
      }
    });
  });
  save();
  render();
  alert(mergedCount > 0 ? `Combined ${mergedCount} duplicate card${mergedCount > 1 ? 's' : ''} into existing ones.` : 'No duplicates found — everything is already combined.');
}

function consumeFromStatus(status, type, qty){
  let remaining = qty;
  const rest = [];
  state.items.forEach(it => {
    if(remaining > 0 && it.status === status && it.type === type){
      if(it.qty <= remaining){
        remaining -= it.qty;
      } else {
        it.qty -= remaining;
        remaining = 0;
        rest.push(it);
      }
    } else {
      rest.push(it);
    }
  });
  state.items = rest;
}

  const label = `${it.type}${it.ref ? ' (' + it.ref + ')' : ''}`;
  const isFinished = it.status === 'vinaged';
  const promptMsg = it.qty > 1
    ? `How many "${label}" do you want to remove? (${it.qty} in stock)${isFinished ? ' — use for damaged or written-off items' : ''}`
    : `Remove "${label}"?${isFinished ? ' Use for damaged or written-off items.' : ''}`;
  const input = prompt(promptMsg, String(it.qty));
  if(input === null) return;
  const n = parseInt(input);
  if(!n || n <= 0){

  if(removeQty >= it.qty){

  } else {
    it.qty -= removeQty;
  }
  save(); render();
}

function setupSignaturePad(canvasId){
  canvasId = canvasId || 'sigCanvas';
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const cssHeight = 120;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, rect.width) * dpr;
  canvas.height = cssHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.strokeStyle = '#2A2519';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const pad = { ctx, hasContent: false, drawing: false, lastX: 0, lastY: 0 };
  sigPads[canvasId] = pad;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const cx = (t ? t.clientX : e.clientX) - r.left;
    const cy = (t ? t.clientY : e.clientY) - r.top;
    return { x: cx, y: cy };
  }
  function start(e){
    e.preventDefault();
    pad.drawing = true;
    const p = pos(e);
    pad.lastX = p.x; pad.lastY = p.y;
  }
  function move(e){
    if(!pad.drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(pad.lastX, pad.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    pad.lastX = p.x; pad.lastY = p.y;
    pad.hasContent = true;
  }
  function end(){ pad.drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('touchcancel', end);
}

function clearSignature(canvasId){
  canvasId = canvasId || 'sigCanvas';
  const canvas = document.getElementById(canvasId);
  const pad = sigPads[canvasId];
  if(!canvas || !pad) return;
  pad.ctx.clearRect(0, 0, canvas.width, canvas.height);
  pad.hasContent = false;
}

function getSignatureDataUrl(canvasId){
  canvasId = canvasId || 'sigCanvas';
  const canvas = document.getElementById(canvasId);
  const pad = sigPads[canvasId];
  if(!canvas || !pad || !pad.hasContent) return null;
  return canvas.toDataURL('image/png');
}

function submitDispatch(requireDriverSig){
  const cust = document.getElementById('custInput').value.trim();
  if(!cust){
    document.getElementById('dispErr').style.display = 'block';
    return;
  }
  const driverSignature = getSignatureDataUrl('sigCanvas');
  if(requireDriverSig && !driverSignature){
    const err = document.getElementById('dispErr');
    err.textContent = 'Driver signature required';
    err.style.display = 'block';
    return;
  }
  const driverName = document.getElementById('driverNameInput').value.trim();
  const vehicleReg = document.getElementById('vehicleRegInput').value.trim();
  if(dispatchCart.length === 0) return;
  const date = todayStr();
  const noteId = uid();
  const noteItems = [];

  dispatchCart.forEach(c => {
    let item;
    if(c.stockItemId){
      item = state.items.find(x => x.id === c.stockItemId);
      if(!item) return;
      item.status = 'dispatched';
      item.dispatchedDate = date;
      item.noteId = noteId;
    } else {
      consumeFromStatus('vinaged', c.type, c.qty);
      item = {
        id: uid(), type: c.type, qty: c.qty, ref: c.ref,
        status: 'dispatched',
        addedDate: date,
        vinagedDate: date,
        dispatchedDate: date,
        noteId: noteId
      };
      state.items.push(item);
    }
    noteItems.push({ stockItemId: item.id, type: item.type, qty: item.qty, ref: item.ref });
  });

  const note = {
    id: noteId,
    number: 'DN-' + String(nextNo).padStart(4,'0'),
    date,
    customer: cust,
    items: noteItems,
    driverSignature: driverSignature || null,
    driverSignedDate: driverSignature ? date : null,
    driverName,
    vehicleReg,
    siteSignature: null,
    siteSignedDate: null
  };
  nextNo += 1;
  state.notes.push(note);
  dispatchCart = [];

  save();
  closeModal();
  render();
  viewNote(noteId);
}

function viewNote(noteId){

function confirmDriverSignaturePending(noteId){
  const note = state.notes.find(n => n.id === noteId);

  const driverSig = getSignatureDataUrl('pendingDriverSig');

    document.getElementById('pendingDriverErr').style.display = 'block';
    return;
  }
  const nameInput = document.getElementById('pendingDriverName');
  const regInput = document.getElementById('pendingVehicleReg');
  if(nameInput) note.driverName = nameInput.value.trim();
  if(regInput) note.vehicleReg = regInput.value.trim();
  note.driverSignature = driverSig;
  note.driverSignedDate = todayStr();
  save();
  render();
  viewNote(noteId);
}

function removeNoteItem(noteId, stockItemId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  if(note.items.length <= 1){
    alert('A delivery note needs at least one item. Close this note and add items back to Finished stock manually if you dispatched by mistake.');
    return;
  }
  const stockItem = state.items.find(it => it.id === stockItemId);
  if(stockItem){
    stockItem.status = 'vinaged';
    stockItem.dispatchedDate = null;
    stockItem.noteId = null;
  }
  note.items = note.items.filter(x => x.stockItemId !== stockItemId);
  save();
  render();
  viewNote(noteId);
}

function addFinishedItemToNote(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  const select = document.getElementById('addFromFinished');
  const stockItemId = select.value;
  if(!stockItemId) return;
  const it = state.items.find(x => x.id === stockItemId);
  if(!it) return;
  const date = todayStr();
  it.status = 'dispatched';
  it.dispatchedDate = date;
  it.noteId = noteId;
  note.items.push({ stockItemId: it.id, type: it.type, qty: it.qty, ref: it.ref });
  save();
  render();
  viewNote(noteId);
}

function addAdhocItemToNote(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  const type = document.getElementById('addAdhocType').value;
  const qty = Math.max(1, parseInt(document.getElementById('addAdhocQty').value) || 1);
  const ref = document.getElementById('addAdhocRef').value.trim();
  const date = todayStr();
  consumeFromStatus('vinaged', type, qty);

  const existingLine = note.items.find(x => x.type === type && (x.ref || '') === (ref || ''));
  const existingStockItem = existingLine ? state.items.find(si => si.id === existingLine.stockItemId) : null;
  if(existingLine && existingStockItem){
    existingStockItem.qty += qty;
    existingLine.qty += qty;
  } else {
    const item = {
      id: uid(), type, qty, ref,
      status: 'dispatched',
      addedDate: date,
      vinagedDate: date,
      dispatchedDate: date,
      noteId: noteId
    };
    state.items.push(item);
    note.items.push({ stockItemId: item.id, type, qty, ref });
  }
  save();
  render();
  viewNote(noteId);
}

async function generateDocketImage(note){
  const printArea = document.getElementById('printArea');
  if(!printArea || !window.html2canvas) return null;
  try{
    const canvas = await html2canvas(printArea, { backgroundColor: '#F3EEDF', scale: 2 });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(!blob) return null;
    return new File([blob], `${note.number}.png`, { type: 'image/png' });
  }catch(e){
    console.error('docket image generation failed', e);
    return null;
  }
}

function noteTextLines(note){
  return [
    `Delivery note ${note.number}`,
    `Date: ${note.date}`,
    `To: ${note.customer}`,
    isNoteComplete(note) ? 'Signed: Yes' : 'Signed: No',
    '',
    ...note.items.map((x, i) => `${i + 1}. x${x.qty} ${x.type}`)
  ];
}

async function shareWhatsApp(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;

  if(navigator.share){
    const file = await generateDocketImage(note);
    if(file && (!navigator.canShare || navigator.canShare({ files: [file] }))){
      try{
        await navigator.share({ files: [file], title: `Delivery note ${note.number}`, text: `Delivery note ${note.number} — ${note.customer}` });
        return;
      }catch(e){
        if(e && e.name === 'AbortError') return;
        console.error('image share failed, falling back to text', e);
      }
    }
  }

  const text = noteTextLines(note).join('\n');
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

async function shareEmail(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;

  if(navigator.share){
    const file = await generateDocketImage(note);
    if(file && (!navigator.canShare || navigator.canShare({ files: [file] }))){
      try{
        await navigator.share({ files: [file], title: `Delivery note ${note.number}`, text: `Delivery note ${note.number} — ${note.customer}` });
        return;
      }catch(e){
        if(e && e.name === 'AbortError') return;
        console.error('image share failed, falling back to mailto', e);
      }
    }
  }

  const subject = `Delivery note ${note.number}`;
  const body = noteTextLines(note).join('\n');
  window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

function updateDriveUi(){

  dot.className = 'drive-dot' + (drive.status === 'connected' ? ' on' : drive.status === 'syncing' ? ' syncing' : drive.status === 'error' ? ' err' : '');
  const labels = {
    disconnected: 'Google Drive',
    connected: 'Drive: archive ready',
    syncing: 'Drive: connecting…',
    error: 'Drive: error'
  };

}

}

function ensureTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    return null;
  }
  if(tokenClient) return tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: drive.clientId,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if(resp.error){
        setDriveStatus('error');
        return;
      }
      driveAccessToken = resp.access_token;
      onDriveSignedIn();
    }
  });
  return tokenClient;
}

function connectDrive(){
  const tc = ensureTokenClient();
  if(!tc){
    alert('Google sign-in library is still loading — wait a second and click Google Drive again.');
    return;
  }
  setDriveStatus('syncing');
  tc.requestAccessToken({ prompt: 'consent' });
}

function tryAutoReconnectDrive(){
  setTimeout(() => {
    const tc = ensureTokenClient();
    if(!tc) return;
    tc.requestAccessToken({ prompt: '' });
  }, 400);
}

function disconnectDrive(){

async function createCloudBinAndConnect(){
  const apiKey = document.getElementById('syncApiKeyInput').value.trim();
  const errEl = document.getElementById('syncErr');
  errEl.style.display = 'none';
  if(!apiKey){
    errEl.textContent = 'Enter your API key first.';

    return;
  }
  const btn = document.getElementById('syncCreateBtn');
  btn.textContent = 'Creating…';
  btn.disabled = true;
  try{
    const binId = await createSharedBin(apiKey);
    cloudSync = { apiKey, binId };
    document.getElementById('syncBinIdInput').value = binId;
    save();
    setSyncStatus('connected');
    startCloudPolling();
    errEl.style.display = 'none';
  } catch(e){

    errEl.style.display = 'block';

async function saveCloudConfigAndConnect(){
  const apiKey = document.getElementById('syncApiKeyInput').value.trim();
  const binId = document.getElementById('syncBinIdInput').value.trim();
  const errEl = document.getElementById('syncErr');
  errEl.style.display = 'none';
  if(!apiKey || !binId){
    errEl.textContent = 'Enter both the API key and the Bin ID.';
    errEl.style.display = 'block';
    return;
  }
  cloudSync = { apiKey, binId };
  save();
  const ok = await pullFromCloud(true);
  if(ok){
    startCloudPolling();
    closeModal();
  } else {
    errEl.textContent = 'Could not connect — check the API key and Bin ID and try again.';
    errEl.style.display = 'block';
  }
}

async function pullFromCloud(showBusy){
  if(!cloudSync.apiKey || !cloudSync.binId) return false;
  try{
    if(showBusy) setSyncStatus('syncing');
    const res = await fetch('https://api.jsonbin.io/v3/b/' + cloudSync.binId + '/latest', {
      headers: { 'X-Master-Key': cloudSync.apiKey }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const remote = data.record;
    if(remote && Array.isArray(remote.items)){
      state.items = remote.items || [];
      state.notes = remote.notes || [];
      nextNo = remote.nextNo || nextNo;
      itemTypes = (remote.itemTypes && remote.itemTypes.length) ? remote.itemTypes : itemTypes;
      users = Array.isArray(remote.users) ? remote.users : users;
      renderTypeSelects();
      render();
      renderUserBadge();
      applyPermissionsToUi();
      await persistLocal();
    }
    setSyncStatus('connected');
    return true;
  } catch(e){
    setSyncStatus('error');
    return false;
  }
}

async function pushToCloud(){
  if(!cloudSync.apiKey || !cloudSync.binId) return false;
  try{
    const content = { items: state.items, notes: state.notes, nextNo, itemTypes, users };
    const res = await fetch('https://api.jsonbin.io/v3/b/' + cloudSync.binId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudSync.apiKey },
      body: JSON.stringify(content)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('connected');
    return true;
  } catch(e){
    setSyncStatus('error');
    return false;
  }
}

async function createSharedBin(apiKey){
  const content = { items: state.items, notes: state.notes, nextNo, itemTypes, users };
  const res = await fetch('https://api.jsonbin.io/v3/b', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey, 'X-Bin-Name': 'oak-joinery-dispatch-board' },
    body: JSON.stringify(content)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data.metadata.id;
}

function queueCloudSync(){
  if(!cloudSync.apiKey || !cloudSync.binId) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(pushToCloud, 800);
}

function startCloudPolling(){
  if(cloudPollTimer) clearInterval(cloudPollTimer);
  if(!cloudSync.apiKey || !cloudSync.binId) return;
  cloudPollTimer = setInterval(() => pullFromCloud(false), 120000); // every 2 minutes
}

window.addEventListener('focus', () => { if(cloudSync.apiKey && cloudSync.binId) pullFromCloud(false); });

async function driveApiFetch(url, options){
  options = options || {};
  const headers = Object.assign({ Authorization: 'Bearer ' + driveAccessToken }, options.headers || {});
  const res = await fetch(url, Object.assign({}, options, { headers }));
  if(res.status === 401){
    driveAccessToken = null;
    setDriveStatus('error');
    throw new Error('Drive session expired — reconnect');
  }
  if(!res.ok){
    const text = await res.text().catch(() => '');
    throw new Error('Drive API ' + res.status + ' ' + text);
  }
  return res;
}

const DISPATCH_RECORDS_FOLDER = 'Oak Joinery Dispatch Notes';
let dispatchFolderIdCache = null;

async function findOrCreateDriveFolder(name){
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  const data = await res.json();
  if(data.files && data.files[0]) return data.files[0].id;
  const res2 = await driveApiFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder' })
  });
  const created = await res2.json();
  return created.id;
}

async function createDriveBinaryFile(name, blob, mimeType, folderId){
  const boundary = 'oakjoinery-boundary-rec';
  const metadata = { name, mimeType, parents: [folderId] };
  const metaPart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: ${mimeType}\r\n\r\n`;
  const closePart = `\r\n--${boundary}--`;
  const body = new Blob([metaPart, blob, closePart]);
  const res = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  return res.json();
}

async function updateDriveBinaryFile(fileId, blob, mimeType){
  await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': mimeType },
    body: blob
  });
}

async function generateDocketPdfBlob(){
  const printArea = document.getElementById('printArea');
  if(!printArea || !window.html2canvas || !window.jspdf) return null;
  const canvas = await html2canvas(printArea, { backgroundColor: '#F3EEDF', scale: 2 });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'px', format: [canvas.width, canvas.height] });
  pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
  return pdf.output('blob');
}

async function saveDispatchRecordToDrive(note){
  if(!driveAccessToken) return { ok: false, reason: 'not-connected' };
  try{
    const pdfBlob = await generateDocketPdfBlob();
    if(!pdfBlob) return { ok: false, reason: 'render-failed' };
    if(note.driveFileId){
      await updateDriveBinaryFile(note.driveFileId, pdfBlob, 'application/pdf');
    } else {
      if(!dispatchFolderIdCache) dispatchFolderIdCache = await findOrCreateDriveFolder(DISPATCH_RECORDS_FOLDER);
      const fileName = `${note.number} - ${note.customer}.pdf`;
      const created = await createDriveBinaryFile(fileName, pdfBlob, 'application/pdf', dispatchFolderIdCache);
      note.driveFileId = created.id;
    }
    await persistLocal();
    return { ok: true };
  }catch(e){
    console.error('dispatch record upload failed', e);
    return { ok: false, reason: 'error' };
  }
}

async function manualSaveRecord(noteId){
  const note = state.notes.find(n => n.id === noteId);
  if(!note) return;
  if(!driveAccessToken){
    alert('Connect Google Drive first (top toolbar) to save a copy of this note.');
    return;
  }
  const result = await saveDispatchRecordToDrive(note);
  if(result.ok){
    render();
    viewNote(noteId);
  } else {
    alert('Could not save a copy to Drive — try again in a moment.');
  }
}

// ===================== USERS, LOGIN & PERMISSIONS =====================
// Client-side only — a deterrent for normal staff use, not a real
// security boundary (anyone with browser devtools could bypass it).
// See dev notes CORE DATA MODEL for the users[] shape.

// Auto-logout after inactivity — mainly so a phone left unlocked on a
// workshop bench doesn't stay logged in as root indefinitely.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000; // 20 minutes
let idleTimer = null;

function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(!currentUserId) return;
  idleTimer = setTimeout(() => { if(currentUserId) logoutUser(); }, IDLE_TIMEOUT_MS);
}

['click', 'keydown', 'touchstart'].forEach(evt => {
  window.addEventListener(evt, () => { if(currentUserId) resetIdleTimer(); }, { passive: true });
});

async function checkLogin(){
  let savedId = null;
  try{
    const res = await storage.get('currentUserId', false);
    savedId = res && res.value ? res.value : null;
  }catch(e){}
  if(savedId && users.some(u => u.id === savedId)){
    currentUserId = savedId;
    hideLoginOverlay();
    resetIdleTimer();
  } else {
    currentUserId = null;
    showLoginScreen();
  }
  renderUserBadge();
  applyPermissionsToUi();
}

function promptPin(userId){
  const u = users.find(x => x.id === userId);
  if(!u) return;

  layer.innerHTML = `<div class="login-card">

    <button class="btn" style="width:100%;" onclick="showLoginScreen()">Back</button>
  </div>`;
  const pinEl = document.getElementById('pinInput');
  pinEl.focus();
  pinEl.addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptLogin(u.id); });
}

async function attemptLogin(userId){
  const u = users.find(x => x.id === userId);
  if(!u) return;

  const rec = loginAttempts[userId] || { count: 0, lockedUntil: 0 };
  if(rec.lockedUntil && Date.now() < rec.lockedUntil){
    const secsLeft = Math.ceil((rec.lockedUntil - Date.now()) / 1000);
    const err = document.getElementById('loginErr');
    err.textContent = `Too many wrong attempts. Try again in ${secsLeft}s.`;
    err.style.display = 'block';
    return;
  }

  const entered = document.getElementById('pinInput').value;
  const enteredHash = await hashPin(entered);
  if(enteredHash !== u.pin){
    rec.count += 1;
    if(rec.count >= MAX_LOGIN_ATTEMPTS){
      rec.lockedUntil = Date.now() + LOCKOUT_MS;
      rec.count = 0;
    }
    loginAttempts[userId] = rec;
    const err = document.getElementById('loginErr');
    err.textContent = rec.lockedUntil && Date.now() < rec.lockedUntil
      ? `Too many wrong attempts. Try again in ${Math.ceil(LOCKOUT_MS/1000)}s.`
      : "Incorrect PIN. Ask your admin to reset it if you've forgotten it.";
    err.style.display = 'block';
    return;
  }

  delete loginAttempts[userId];
  currentUserId = u.id;
  try{ await storage.set('currentUserId', u.id, false); }catch(e){}
  hideLoginOverlay();
  renderUserBadge();
  applyPermissionsToUi();
  resetIdleTimer();
}

async function createRootAccount(){
  const username = document.getElementById('rootUsername').value.trim();
  const pin = document.getElementById('rootPin').value;
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  if(!username || pin.length < 4){
    err.textContent = 'Enter a username and a PIN of at least 4 characters.';
    err.style.display = 'block';
    return;
  }
  const pinHash = await hashPin(pin);
  const rootUser = { id: uid(), username, pin: pinHash, isRoot: true, permissions: defaultPermissions() };
  users.push(rootUser);
  currentUserId = rootUser.id;
  try{ await storage.set('currentUserId', rootUser.id, false); }catch(e){}
  save();
  hideLoginOverlay();
  renderUserBadge();
  applyPermissionsToUi();
  resetIdleTimer();
}

  currentUserId = null;
  clearTimeout(idleTimer);

async function saveUserForm(editId){
  const username = document.getElementById('userFormUsername').value.trim();
  const pin = document.getElementById('userFormPin').value;
  const isRoot = document.getElementById('userFormRoot').checked;
  const err = document.getElementById('userFormErr');
  err.style.display = 'none';
  if(!username){
    err.textContent = 'Enter a username.';
    err.style.display = 'block';
    return;
  }
  if(!editId && pin.length < 4){
    err.textContent = 'Enter a PIN of at least 4 characters.';
    err.style.display = 'block';
    return;
  }
  if(pin && pin.length < 4){
    err.textContent = 'PIN must be at least 4 characters (or leave it blank to keep the current one).';
    err.style.display = 'block';
    return;
  }
  if(users.some(u => u.username.toLowerCase() === username.toLowerCase() && u.id !== editId)){
    err.textContent = 'That username is already taken.';
    err.style.display = 'block';
    return;
  }
  const permissions = defaultPermissions();
  document.querySelectorAll('.permCheck').forEach(cb => { permissions[cb.dataset.key] = cb.checked; });

  if(editId){
    const u = users.find(x => x.id === editId);
    if(u){
      u.username = username;
      if(pin) u.pin = await hashPin(pin);
      u.isRoot = isRoot;
      u.permissions = permissions;
    }
  } else {
    users.push({ id: uid(), username, pin: await hashPin(pin), isRoot, permissions });
  }
  save();
  renderUserBadge();
  applyPermissionsToUi();
  openManageUsers();
}

function deleteUser(userId){
  const target = users.find(u => u.id === userId);
  if(!target) return;
  if(target.isRoot && users.filter(u => u.isRoot).length <= 1){
    alert("You can't delete the only root account — make another user root first.");
    return;
  }
  if(userId === currentUserId){
    alert("You can't delete the account you're currently logged in as. Switch to another user first.");
    return;
  }
  if(!confirm(`Remove ${target.username}?`)) return;
  users = users.filter(u => u.id !== userId);
  save();
  openManageUsers();
}

document.getElementById('manageUsersBtn').addEventListener('click', () => openManageUsers());

async function persistLocal(){
  try{
    await storage.set('board', JSON.stringify({items: state.items, notes: state.notes, nextNo, itemTypes, users, drive: {clientId: drive.clientId}, sync: {apiKey: cloudSync.apiKey, binId: cloudSync.binId}}), false);
  }catch(e){ console.error('storage failed', e); }
}

load();
</script>
